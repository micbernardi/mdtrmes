/* 7a. Gráficos (Chart.js) */
const rotuloValor = { // escreve o valor na ponta da barra
  id:'rotuloValor',
  afterDatasetsDraw(ch){
    const {ctx} = ch;
    ch.data.datasets.forEach((ds, i) => {
      if (!ds.rotulo) return;
      const meta = ch.getDatasetMeta(i); if (meta.hidden) return;
      meta.data.forEach((el, j) => {
        const t = ds.rotulo(j); if (!t) return;
        ctx.save(); ctx.font = '600 11px ' + FONT; ctx.fillStyle = '#1B2733';
        if (ch.options.indexAxis === 'y'){ ctx.textBaseline = 'middle'; ctx.fillText(t, el.x + 6, el.y); }
        else { ctx.textAlign = 'center'; ctx.fillText(t, el.x, el.y - 6); }
        ctx.restore();
      });
    });
  }
};
const linhaMeta = { // linha vertical tracejada na meta
  id:'linhaMeta',
  afterDatasetsDraw(ch, _, o){
    if (o == null || o.valor == null) return;
    const x = ch.scales.x.getPixelForValue(o.valor), {top, bottom} = ch.chartArea, ctx = ch.ctx;
    ctx.save(); ctx.strokeStyle = '#0E2A47'; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(x, top - 4); ctx.lineTo(x, bottom); ctx.stroke(); ctx.setLineDash([]);
    ctx.font = '600 11px ' + FONT; ctx.fillStyle = '#0E2A47'; ctx.textAlign = x > ch.chartArea.right - 60 ? 'right' : 'center';
    ctx.fillText(o.texto || '', x, top - 8); ctx.restore();
  }
};
const rotuloSegmento = { // percentual dentro de cada bloco da barra empilhada
  id:'rotuloSegmento',
  afterDatasetsDraw(ch){
    const ctx = ch.ctx;
    ch.data.datasets.forEach((ds, i) => {
      const meta = ch.getDatasetMeta(i); if (meta.hidden) return;
      meta.data.forEach((el, j) => {
        const v = ds.data[j], len = Math.abs(el.x - el.base); if (!v || len < 30) return;
        ctx.save(); ctx.font = '600 12px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = /^#(0E2A47|1F5FA8|D64545|2E9E5B|E3A008)$/i.test(ds.backgroundColor) ? '#fff' : '#0E2A47';
        ctx.fillText(Math.round(v) + '%', (el.x + el.base) / 2, el.y); ctx.restore();
      });
    });
  }
};
function grafico(id, cfg){
  if (S.charts[id]) S.charts[id].destroy();
  const el = document.getElementById(id); if (!el) return;
  S.charts[id] = new Chart(el, cfg);
}
function desenharGraficos(A, M, est){
  if (typeof Chart === 'undefined') return;
  Chart.defaults.font.family = FONT; Chart.defaults.color = '#5D6B7A';
  const labels = CATS.map(c => 'TOP ' + c);
  const cor1 = {verde:'#2E9E5B', amarelo:'#E3A008', vermelho:'#D64545'}[M.sem] || CAT_COR[1];
  const cores = CATS.map(c => c === 1 ? cor1 : CAT_COR[c]);
  const p100 = v => v == null ? null : Math.round(v * 1000) / 10;

  // Gráfico 1 — cobertura por categoria: uma barra por categoria e a linha da meta do TOP 1
  grafico('ch1', {type:'bar', data:{labels, datasets:[{label: est ? 'Cobertura estimada' : 'Cobertura', data:CATS.map(c => p100(M.cov[c])),
      backgroundColor:cores, barPercentage:.7, rotulo: j => M.cov[CATS[j]] == null ? '' : fp(M.cov[CATS[j]])}]},
    plugins:[rotuloValor, linhaMeta],
    options:{indexAxis:'y', maintainAspectRatio:false, layout:{padding:{right:36, top:18}},
      scales:{x:{min:0, max:100, ticks:{callback:v => v + '%'}, grid:{color:'#EEF2F6'}}, y:{grid:{display:false}}},
      plugins:{legend:{display:false}, linhaMeta:{valor:M.limV, texto:`Meta TOP 1: ${Math.round(M.limV)}%`},
        tooltip:{callbacks:{label:c => {
          const cat = CATS[c.dataIndex], b = A.cats[cat];
          const l = [`Cobertura${est ? ' estimada' : ''}: ${fp(M.cov[cat])} (${est ? '≈ ' : ''}${fn(b.vis)} de ${fn(b.cad)} médicos)`];
          if (est) l.push(`Faixa possível: ${fp(M.lo[cat])} a ${fp(M.hi[cat])}`);
          return l; }}}}}});

  // Gráfico 2 — como o PV classificou o painel (quantidade e % por categoria)
  const cl = CATS.map(c => ({l:'TOP ' + c, n:A.cats[c].cad, cor:CAT_COR[c]}));
  if (A.sem.cad) cl.push({l:'Sem categoria', n:A.sem.cad, cor:CAT_COR[0]});
  const totCl = cl.reduce((t, x) => t + x.n, 0);
  grafico('ch2', {type:'bar', data:{labels:cl.map(x => x.l), datasets:[{data:cl.map(x => x.n), backgroundColor:cl.map(x => x.cor), barPercentage:.7,
      rotulo: j => `${fn(cl[j].n)} (${fp(cl[j].n / totCl)})`}]}, plugins:[rotuloValor],
    options:{indexAxis:'y', maintainAspectRatio:false, layout:{padding:{right:70}}, scales:{x:{grid:{color:'#EEF2F6'}, ticks:{precision:0}}, y:{grid:{display:false}}},
      plugins:{legend:{display:false}, tooltip:{callbacks:{label:c => `${fn(c.raw)} médicos (${fp(c.raw / totCl)} do painel)`}}}}});

  // Gráfico 6 — acumulado dia a dia (dias úteis do ciclo), uma linha por TOP + meta do TOP 1
  if (document.getElementById('ch6')){
    const c = S.T.c, dias = [];
    for (let d = new Date(c.ini); d <= c.fim; d.setDate(d.getDate() + 1)) if (duDia(d, c) > 0) dias.push(new Date(d));
    const fimSem = Array.from({length: CFG.semanasCiclo}, (_, i) => isoD(fimDaSemana(c, i + 1)));
    const nomeDia = ['dom','seg','ter','qua','qui','sex','sáb'];
    const grupos = gruposTempo().map(g => ({nome: g.n, cor: g.cor, cs: g.cs, ds: A.docs.filter(d => g.cs.includes(d.cat))})).filter(g => g.ds.length);
    const dsT = grupos.map(g => ({label: `${g.nome} (${g.ds.length} médicos)`, _g: g,
      data: dias.map(dia => dia > S.T.ref ? null : Math.round(g.ds.filter(d => d.primeira && d.primeira <= dia).length / g.ds.length * 1000) / 10),
      borderColor: g.cor, backgroundColor: g.cor, borderWidth: g.cs[0] === 1 ? 4 : 2, pointRadius: 0, pointHoverRadius: 5, tension: .15}));
    dsT.push({label:'Meta TOP 1', data: dias.map(dia => Math.round(metaEm(duEntre(c, dia) / S.T.total))), borderColor:'#0E2A47', borderDash:[6,4], borderWidth:2, pointRadius:0, pointHoverRadius:0, fill:false});
    grafico('ch6', {type:'line', data:{labels: dias.map(fmtD), datasets: dsT},
      options:{maintainAspectRatio:false, interaction:{mode:'nearest', intersect:false, axis:'xy'},   // só a linha mais próxima do mouse
        scales:{y:{min:0, max:100, ticks:{callback:v => v + '%'}, grid:{color:'#EEF2F6'}},
                x:{grid:{color: ctx => fimSem.includes(isoD(dias[ctx.index] || c.ini)) ? '#C9D2DB' : 'transparent'},
                   ticks:{autoSkip:false, maxRotation:0, callback:(v, i) => { const k = fimSem.indexOf(isoD(dias[i])); return k >= 0 ? `Sem. ${k + 1} (${fmtD(dias[i])})` : ''; }}}},
        plugins:{legend:{position:'bottom', labels:{boxWidth:14}},
          tooltip:{callbacks:{
            title: it => { const d = dias[it[0].dataIndex]; return `${nomeDia[d.getDay()]}, ${fmtD(d)} · semana ${semanaDU(d, c)} de campo`; },
            label: x => { if (x.raw == null) return null; const g = x.dataset._g;
              if (!g) return `Meta TOP 1: ${x.raw}%`;
              const n = g.ds.filter(d => d.primeira && d.primeira <= dias[x.dataIndex]).length;
              return `${g.nome}: ${Math.round(x.raw)}% (${n} de ${g.ds.length})`; }}}}}});
  }

  // Gráfico 5 — médicos por cidade e categoria (15 cidades com mais TOP 1)
  const cids = porCidade(A).slice(0, 15);
  if (cids.length && document.getElementById('ch5')){
    grafico('ch5', {type:'bar', data:{labels: cids.map(c => c.nome),
      datasets: CATS.map(c => ({label:'TOP ' + c, data: cids.map(x => x.cat[c] || 0), backgroundColor: CAT_COR[c], stack:'s'}))},
      options:{indexAxis:'y', maintainAspectRatio:false, scales:{x:{stacked:true, grid:{color:'#EEF2F6'}, ticks:{precision:0}}, y:{stacked:true, grid:{display:false}}},
        plugins:{legend:{position:'bottom', labels:{boxWidth:12}}}}});
  }

  // Gráfico 4 — peso de cada categoria no painel e nas visitas (barras 100%)
  const totCad = CATS.reduce((t, c) => t + A.cats[c].cad, 0), totVis = CATS.reduce((t, c) => t + A.cats[c].vis, 0);
  grafico('ch4', {type:'bar', data:{labels:[`Painel (${fn(totCad)} médicos)`, `Visitados (${est ? '≈ ' : ''}${fn(totVis)} médicos)`],
      datasets: CATS.map(c => ({label:'TOP ' + c, stack:'s', backgroundColor: c === 1 ? cor1 : CAT_COR[c],
        data:[totCad ? A.cats[c].cad / totCad * 100 : 0, totVis ? A.cats[c].vis / totVis * 100 : 0]}))},
    plugins:[rotuloSegmento],
    options:{indexAxis:'y', maintainAspectRatio:false,
      scales:{x:{stacked:true, min:0, max:100, ticks:{callback:v => v + '%'}, grid:{color:'#EEF2F6'}}, y:{stacked:true, grid:{display:false}}},
      plugins:{legend:{position:'bottom', labels:{boxWidth:12}},
        tooltip:{callbacks:{label:c => { const cat = CATS[c.datasetIndex], n = c.dataIndex ? A.cats[cat].vis : A.cats[cat].cad, t = c.dataIndex ? totVis : totCad;
          return `${c.dataset.label}: ${c.dataIndex && est ? '≈ ' : ''}${fn(n)} de ${fn(t)} médicos ${c.dataIndex ? 'visitados' : 'do painel'} (${Math.round(c.raw)}%)`; }}}}}});
}

/* 7b. Painel lateral: critérios, arquivos e avisos de cruzamento */
function renderDrawer(todos){
  const avisos = [];
  todos.forEach(a => {
    const n = nomeSetor(a.key);
    if (a.semEst.length) avisos.push(`${n}: especialidades do painel sem correspondência na estatística, fora do cálculo: ${a.semEst.map(e => `${e.esp} (${e.n})`).join(', ')}. Se alguma tiver outro nome na estatística, ligue abaixo.`);
    if (a.foraPainel.length) avisos.push(`${n}: especialidades da estatística que não existem no painel: ${a.foraPainel.map(e => `${e.esp} (${e.vis} visitados)`).join(', ')}.`);
    if (a.diverg.length) avisos.push(`${n}: número de médicos diferente entre painel e estatística em ${a.diverg.join('; ')}.`);
    if (a.usouVisitas) avisos.push(`${n}: a estatística não traz "médicos visitados"; foi usada a coluna de visitas, limitada ao número de médicos.`);
    if (a.visForaPainel) avisos.push(`${n}: ${a.visForaPainel} médicos visitados no relatório não foram encontrados no painel.`);
    if (a.mode === 'sem-painel') avisos.push(`${n}: falta o painel médico.`);
  });
  todos.filter(a => a.mode === 'sem-categoria').forEach(a => avisos.push(`${nomeSetor(a.key)}: estatística carregada, mas nenhuma categoria preenchida no painel. Carregue a versão do painel preenchida por ele.`));
  const semEstat = todos.filter(a => a.mode === 'sem-estat').map(a => S.labels[a.key] || a.key);
  if (semEstat.length) avisos.push(`Propagandistas do painel ainda sem estatística carregada: ${semEstat.join(', ')}. Eles ficam fora da visão consolidada até a estatística ser carregada.`);
  const cats = new Map(); S.panels.forEach(p => p.docs.forEach(d => { if (d.catRaw && !d.cat) cats.set(d.catRaw, 1); }));
  if (cats.size) avisos.push(`Valores de categoria não reconhecidos (tratados como sem categoria): ${[...cats.keys()].slice(0,5).join(', ')}.`);

  const setoresReais = setorKeys().filter(k => /^\d/.test(k) || !k.includes('-'));
  $('#drawerBody').innerHTML = `
  <div><h4>Escala de categorias</h4>
    <label class="field" style="max-width:320px"><select id="cfgEsc">${[['auto','Automática (maior categoria usada)'],['4','1 a 4'],['5','1 a 5']].map(o => `<option value="${o[0]}"${String(CFG.escala) === o[0] ? ' selected' : ''}>${o[1]}</option>`).join('')}</select></label>
    <p class="small muted">Em uso: 1 a ${ESC}. Com a escala fixa em 1 a 4, quem usou 5 tem esses médicos lidos como TOP 4. Os semáforos olham o TOP 1, o TOP 2 e o TOP 3, então a escala não muda a meta.</p></div>
  <div><h4>Pesos do índice de priorização</h4>
    <div class="row">${CATS.map(c => `<label class="field">TOP ${c}<input type="number" min="0" max="20" step="1" data-peso="${c}" value="${CFG.pesos[c]}"></label>`).join('')}</div>
    <p class="small muted">Índice = cobertura ponderada pelos pesos ÷ cobertura simples × 100. Acima de 100, as visitas estão mais concentradas nos médicos de peso alto.</p></div>
  <div><h4>Semáforo do TOP 1</h4>
    <div class="row">${CFG.curva === 'prazo' ? '' : `<label class="field">Meta no fim do ciclo (%)<input type="number" id="cfgV" min="0" max="100" value="${CFG.metaFinal}"></label>`}
    <label class="field">Amarelo até (p.p. abaixo)<input type="number" id="cfgA" min="0" max="100" value="${CFG.tolerancia}"></label>
    <label class="field">Ritmo esperado<select id="cfgR">${[['prazo','TOP 1 dentro do prazo'],['antecipada','Antecipado (curva)'],['linear','Linear'],['fixa','Meta cheia desde a 1ª semana']].map(o => `<option value="${o[0]}"${CFG.curva === o[0] ? ' selected' : ''}>${o[1]}</option>`).join('')}</select></label></div>
    ${CFG.curva === 'prazo' ? `<div class="row" style="margin-top:8px">${CFG.marcos.map((m, i) => `<label class="field">Marco ${i + 1}: % do TOP 1<input type="number" min="0" max="100" data-marco-meta="${i}" value="${m.meta}"></label><label class="field">até o fim da semana<input type="number" min="0.2" max="12" step="0.2" data-marco-sem="${i}" value="${m.sem}"></label>`).join('')}</div>` : ''}
    <p class="small muted">Metas acumuladas: ${curvaTxt()}.${CFG.curva === 'prazo' ? ` A meta sobe dia a dia de um marco ao seguinte: ${marcosTxt()}.` : ''}</p></div>
  <div><h4>Arquivos carregados</h4>
    ${htmlArquivos()}
    ${S.erros.map(e => `<p class="warnbox">${esc(e)}</p>`).join('')}
  </div>
  ${setoresReais.length ? `<div><h4>Nome do propagandista por setor</h4><div class="row">
    ${setoresReais.map(k => `<label class="field">${esc(k)}<input type="text" data-rot="${esc(k)}" value="${esc(S.labels[k] || '')}"></label>`).join('')}</div></div>` : ''}
  ${htmlMapa(todos).replace(/<h3/g,'<h4').replace(/<\/h3>/g,'</h4>')}
  <div><h4>Avisos de cruzamento</h4>${avisos.length ? avisos.map(a => `<p class="warnbox">${esc(a)}</p>`).join('') : '<p class="small muted">Nenhum aviso.</p>'}</div>
  <div><button class="btn dark" data-limpar>Limpar arquivos</button></div>`;

  $('#drawerBody').querySelectorAll('[data-peso]').forEach(i => i.onchange = () => { CFG.pesos[i.dataset.peso] = Math.max(0, +i.value || 0); S.pesosManual = true; render(); });
  const ce = $('#cfgEsc'); if (ce) ce.onchange = () => { CFG.escala = ce.value === 'auto' ? 'auto' : +ce.value; S.pesosManual = false; render(); };
  const v = $('#cfgV'), a = $('#cfgA');
  if (v) v.onchange = () => { CFG.metaFinal = Math.min(100, Math.max(0, +v.value || 0)); render(); };
  if (a) a.onchange = () => { CFG.tolerancia = Math.max(0, +a.value || 0); render(); };
  const rr = $('#cfgR'); if (rr) rr.onchange = () => { CFG.curva = rr.value; render(); };
  $('#drawerBody').querySelectorAll('[data-marco-meta]').forEach(i => i.onchange = () => { CFG.marcos[+i.dataset.marcoMeta].meta = Math.min(100, Math.max(0, +i.value || 0)); render(); });
  $('#drawerBody').querySelectorAll('[data-marco-sem]').forEach(i => i.onchange = () => { CFG.marcos[+i.dataset.marcoSem].sem = Math.max(0.2, +i.value || 1); render(); });
  ligarEdicao($('#drawerBody'));
}

function preencherSelect(keys){
  const sel = $('#selSetor');
  sel.innerHTML = `<option value="ALL">Todos os setores (consolidado)</option>` + keys.map(k => `<option value="${esc(k)}">${esc(nomeSetor(k))}</option>`).join('');
  sel.value = keys.includes(S.setor) ? S.setor : 'ALL';
}

/* =====================================================================
   8. EVENTOS
   ===================================================================== */
function ligarDashboard(A, est){
  ligarLinhasSetor();
  document.querySelectorAll('[data-confirmar]').forEach(b => b.onclick = () => {
    const validos = setorKeys().map(analisarSetor).filter(a => a.mode === 'estimado');
    const k = S.setor !== 'ALL' ? S.setor : validos.length === 1 ? validos[0].key : null;
    if (!k){ toast('Escolha um setor no seletor para conferir os TOP 1'); return; }
    abrirConferencia(k);
  });
  const redesenhaMedicos = () => { $('#medTile').innerHTML = htmlMedicos(A, est); ligarMedicos(); };
  const ligarMedicos = () => {
    document.querySelectorAll('#medTile [data-flag]').forEach(b => b.onclick = () => {
      const v = b.dataset.flag;
      if (v === 'all') S.fCat = [];
      else S.fCat = S.fCat.includes(v) ? S.fCat.filter(x => x !== v) : [...S.fCat, v].sort();
      redesenhaMedicos();
    });
    $('#fEsp').onchange = e => { S.fEsp = e.target.value; redesenhaMedicos(); };
    if ($('#fSem')) $('#fSem').onchange = e => { S.fSem = e.target.value; if (S.fSem !== 'all') S.fVis = 'all'; redesenhaMedicos(); };
    document.querySelectorAll('#medTile [data-sem]').forEach(b => b.onclick = () => {
      const v = b.dataset.sem;
      if (v === 'nao'){ const on = S.fVis === 'nao' && S.fSem === 'all'; S.fSem = 'all'; S.fVis = on ? 'all' : 'nao'; }
      else { S.fSem = S.fSem === v ? 'all' : v; S.fVis = 'all'; }
      redesenhaMedicos();
    });
    $('#fCid').onchange = e => { S.fCid = e.target.value; redesenhaMedicos(); };
    if ($('#fVis')) $('#fVis').onchange = e => { S.fVis = e.target.value; redesenhaMedicos(); };
    $('#fQ').oninput = e => { S.q = e.target.value; clearTimeout(S._qt); S._qt = setTimeout(() => { redesenhaMedicos(); const f = $('#fQ'); f.focus(); f.setSelectionRange(f.value.length, f.value.length); }, 250); };
  };
  ligarMedicos();
  document.querySelectorAll('tr[data-cid]').forEach(tr => {
    const go = () => { S.fCid = tr.dataset.cid; redesenhaMedicos(); $('#medTile').scrollIntoView({behavior:'smooth', block:'start'}); };
    tr.onclick = go; tr.onkeydown = e => { if (e.key === 'Enter') go(); };
  });
}

async function carregar(files){
  if (typeof XLSX === 'undefined'){ toast('A biblioteca de leitura de Excel não carregou. Verifique a conexão.'); return; }
  let ok = 0; const cont = {painel:0, estat:0};
  for (const f of files){
    try {
      const wb = XLSX.read(await f.arrayBuffer(), {type:'array'});
      const tipo = detectarTipo(wb, f.name);
      if (!tipo){ S.erros.push(`${f.name}: não reconheci o arquivo. O painel médico precisa de Nome ou CRM com a categoria na 1ª coluna; a estatística precisa de Especialidade e Visitas (ou uma lista de médicos visitados com CRM/Nome).`); continue; }
      cont[tipo]++;
      if (tipo === 'estat'){
        const d = wb.Props && (wb.Props.ModifiedDate || wb.Props.CreatedDate);
        if (d instanceof Date && !isNaN(d) && (!S.dataEstat || d > S.dataEstat)){
          S.dataEstat = d;
          if (!S.momentoManual){
            // Extração diária: o arquivo traz as visitas até o dia anterior à geração.
            // Gerado na segunda = semana não iniciada; na sexta = até quinta; no fim de semana = semana completa.
            const wd = d.getDay();                      // 0 = domingo, 6 = sábado
            CFG.dia = wd === 0 || wd === 6 ? 5 : wd - 1;
          }
        }
      }
      if (tipo === 'painel'){
        const grupos = parsePainel(wb);
        if (!grupos.length){ S.erros.push(`${f.name}: não encontrei médicos (procuro uma linha de cabeçalho com CRM ou Nome e a categoria na primeira coluna).`); continue; }
        // Abas com várias especialidades cada = uma aba por PV (painel distrital).
        // Abas com uma especialidade só = painel de um PV dividido por especialidade: junta tudo.
        const multi = grupos.length > 1 && grupos.some(g => new Set(g.docs.map(d => d.espK)).size > 1);
        if (!multi && grupos.length > 1 && !grupos.some(g => g.setor)){
          const todosDocs = grupos.flatMap(g => g.docs);
          grupos.splice(0, grupos.length, {aba: grupos[0].aba, docs: todosDocs, dup: 0});
        }
        grupos.forEach(g => {
          // Painel distrital: o PV é a aba e o setor vem do vínculo com a estatística.
          // Painel de uma aba só: o setor pode vir do nome do arquivo ou do conteúdo.
          let setor = g.setor || detSetorNome(g.aba);
          if (!setor && !multi) setor = detSetorNome(f.name) || detSetorConteudo(wb);
          const nomeAba = abaGenerica(g.aba) || /^MEDICOS?$/.test(norm(g.aba)) || detSetorNome(g.aba) ? '' : g.aba;
          const rotulo = multi ? (nomeAba || '') : (rotuloArquivo(f.name) || (wb.SheetNames.length === 1 ? nomeAba : ''));
          const p = {id: ++UID, file: multi ? `${f.name} (aba ${g.aba}${g.setor ? `, setor ${g.setor}` : ''})` : f.name, setor, setorDet: setor, docs: g.docs, abas: 1, dup: g.dup, rotulo};
          // Mesmo PV já carregado (outra versão do painel, ex.: a cópia que ele preencheu):
          // sobrepõe as categorias preenchidas e mantém o resto.
          // rótulos compatíveis: um vazio ou um contido no outro (ex.: "João" e "João preenchido"); evita juntar PVs diferentes com o mesmo código de distrital no nome
          const rotOk = q => { const x = norm(q.rotulo || ''), y = norm(p.rotulo || ''); return !x || !y || x.includes(y) || y.includes(x); };
          const ex = S.panels.find(q => (p.setor && (q.setor === p.setor || q.setorDet === p.setor) && rotOk(q)) || (!p.setor && p.rotulo && norm(q.rotulo) === norm(p.rotulo)));
          if (ex){ sobreporPainel(ex, p, f.name); return; }
          S.panels.push(p);
          const k = keyP(p); if (!S.labels[k] && p.rotulo) S.labels[k] = p.rotulo;
        });
      } else {
        const lst = parseEstatistica(wb, f.name);
        if (!lst.length){ S.erros.push(`${f.name}: não reconheci a estatística (procuro colunas de Especialidade e Visitados, ou CRM/Nome do médico).`); continue; }
        S.stats.push(...lst);
        const variosSetores = new Set(lst.map(x => x.setor)).size > 1;
        lst.forEach(x => { if (x.setor && !S.labels[x.setor] && (x.rotuloDaAba || !variosSetores) && x.rotulo && norm(x.rotulo) !== norm(x.setor)) S.labels[x.setor] = x.rotulo; });
      }
      ok++;
    } catch (e){ S.erros.push(`${f.name}: erro na leitura (${e.message}).`); }
  }
  autoVincular();
  render();
  if (ok) toast([cont.painel ? (cont.painel > 1 ? `${cont.painel} painéis médicos` : '1 painel médico') : '', cont.estat ? `${cont.estat} estatística${cont.estat > 1 ? 's' : ''}` : ''].filter(Boolean).join(' e ') + ' carregado' + (ok > 1 ? 's' : ''));
  else toast('Nenhum arquivo reconhecido. Veja Critérios e arquivos.');
}

$('#btnPainel').onclick = () => $('#inPainel').click();
$('#inPainel').onchange = e => { carregar([...e.target.files]); e.target.value = ''; };
// Arrastar e soltar em qualquer ponto da tela
document.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('drag'); });
document.addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('drag'); });
document.addEventListener('drop', e => { e.preventDefault(); document.body.classList.remove('drag'); if (e.dataTransfer.files.length) carregar([...e.dataTransfer.files]); });
$('#btnLimparTop').onclick = limparTudo;
$('#btnCfg').onclick = () => $('#drawer').classList.add('open');
$('#btnClose').onclick = () => $('#drawer').classList.remove('open');
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#drawer').classList.remove('open'); });
$('#selSetor').onchange = e => { S.setor = e.target.value; S.fCat = []; S.fEsp = 'all'; S.fSem = 'all'; S.fVis = 'all'; S.fCid = 'all'; S.q = ''; render(); };
$('#inCiclo').onchange = e => { S.cicloN = +e.target.value; S.ciclo = null; S.refManual = false; render(); };
$('#inRef').onchange = e => { if (e.target.value){ S.ref = dataIso(e.target.value); S.refManual = true; S.cicloN = cicloDaData(S.ref); S.ciclo = null; } render(); };

render();
