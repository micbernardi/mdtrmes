<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Execução da visitação por categoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
/* =====================================================================
   ESTILO — paleta executiva (azul escuro, azul claro, verde, amarelo, vermelho)
   ===================================================================== */
:root{
  --navy:#0E2A47; --blue:#1F5FA8; --sky:#6FA8DC; --ice:#E3EEF9;
  --green:#2E9E5B; --yellow:#E3A008; --red:#D64545;
  --canvas:#EEF2F6; --card:#FFFFFF; --ink:#1B2733; --muted:#5D6B7A; --line:#D7DEE6;
  --font:"Segoe UI","Source Sans 3",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body.drag::after{content:'Solte as planilhas para carregar';position:fixed;inset:10px;border:3px dashed var(--sky);border-radius:8px;background:rgba(14,42,71,.75);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;z-index:40;pointer-events:none}
body{font-family:var(--font);background:var(--canvas);color:var(--ink);font-size:14px;line-height:1.45}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}

.top{background:var(--navy);color:#fff;padding:14px 22px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.top h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.1px}
.top p{margin:2px 0 0;font-size:12.5px;color:#B9CCE2}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;padding:7px 13px;border-radius:3px;cursor:pointer;font-size:13px}
.btn:hover{background:rgba(255,255,255,.1)}
.btn.primary{background:var(--blue);border-color:var(--blue)}
.btn.primary:hover{background:#2A6DBA}
.btn.dark{border-color:var(--line);color:var(--ink);background:#fff}
.btn.dark:hover{background:var(--ice)}

.slicers{background:#fff;border-bottom:1px solid var(--line);padding:10px 22px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end}
.field{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px}
select,input[type=number],input[type=search],input[type=text]{padding:6px 8px;border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--ink);min-width:0}
input[type=number]{width:84px}
.mode{margin-left:auto;font-size:12.5px;padding:5px 10px;border-radius:12px;background:var(--ice);color:var(--navy)}
.mode.est{background:#FFF4D6;color:#7A5600}

.wrap{padding:16px 22px 48px;max-width:1500px;margin:0 auto;display:grid;gap:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px 16px;min-width:0}
.tile h3{margin:0 0 10px;font-size:14px;font-weight:600;color:var(--navy)}
.tile .hint{font-size:12px;color:var(--muted);margin:-6px 0 10px}

/* Semáforo + KPIs */
.hero{display:grid;gap:14px}
.sema{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px 28px;align-items:center;border-left:6px solid #9AA7B4}
.sema .col{display:flex;flex-direction:column;gap:6px;min-width:0}
.sema .meta-l{font-size:14px}
.sema .leg{font-size:12.5px;color:var(--muted)}
.sema .nota{font-size:12px;color:var(--muted)}
.sema.confirmar{border-left-color:var(--blue)} .sema .st.confirmar{color:var(--blue)} .pill.b{background:var(--ice);color:var(--navy)} .kpi.b{border-left-color:var(--blue)} .gap.conf{background:var(--ice);color:var(--navy)} .legsem .d.b{background:var(--blue)}
.sema.verde{border-left-color:var(--green)} .sema.amarelo{border-left-color:var(--yellow)} .sema.vermelho{border-left-color:var(--red)}
.lamps{display:flex;gap:10px;background:var(--navy);padding:9px 12px;border-radius:24px;width:max-content}
.lamp{width:26px;height:26px;border-radius:50%;background:#2B4461}
.lamp.on.r{background:var(--red);box-shadow:0 0 12px var(--red)}
.lamp.on.y{background:var(--yellow);box-shadow:0 0 12px var(--yellow)}
.lamp.on.g{background:var(--green);box-shadow:0 0 12px var(--green)}
.sema .big{font-size:46px;font-weight:700;line-height:1;color:var(--navy)}
.sema .st{font-weight:600}
.sema .st.verde{color:var(--green)} .sema .st.amarelo{color:#9A6B00} .sema .st.vermelho{color:var(--red)}
.sema small{color:var(--muted);font-size:12px}
/* Semáforos menores do TOP 2 e TOP 3 */
.sema-minis{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.sema.mini{grid-template-columns:auto auto 1fr;gap:6px 18px;padding:10px 14px;border-left-width:5px}
.sema.mini h3{font-size:13px}
.sema.mini .col{gap:4px}
.sema.mini .lamps{gap:7px;padding:6px 9px;border-radius:18px}
.sema.mini .lamp{width:17px;height:17px}
.sema.mini .lamp.on{box-shadow:0 0 8px currentColor}
.sema.mini .big{font-size:30px}
.sema.mini .st{font-size:13px}
.sema.mini .meta-l{font-size:13px}
.sema.mini .nota{font-size:11.5px}
.leitura{font-size:13.5px;padding:8px 10px;border-radius:3px;margin:-2px 0 10px;background:#F6F9FC;border-left:4px solid var(--sky)}
.leitura.ok{background:#EEF8F2;border-left-color:var(--green)}.leitura.warn{background:#FFF8E6;border-left-color:var(--yellow)}.leitura.bad{background:#FDF0F0;border-left-color:var(--red)}
.legsem{display:grid;gap:3px;font-size:12.5px;color:var(--ink)}
.legsem .d{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.legsem .d.g{background:var(--green)}.legsem .d.y{background:var(--yellow)}.legsem .d.r{background:var(--red)}
.gap{font-size:13px;padding:7px 9px;border-radius:3px;line-height:1.35}
.gap.ok{background:#EEF8F2;color:#1D6B3D}
.gap.falta{background:#FDF0F0;color:#8E1F1F}
.gap.quase{background:#FFF8E6;color:#7A5600}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;align-items:start}
.kpi{border-left:4px solid var(--blue)}
.kpi .l{font-size:12.5px;color:var(--muted)}
.info{display:inline-block;width:15px;height:15px;line-height:15px;text-align:center;border-radius:50%;font-size:11px;color:var(--blue);cursor:help;vertical-align:1px}
.minileg{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:6px;font-size:11px;color:#9AA7B4}
.minileg .ml i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px;background:#C9D2DB;vertical-align:1px}
.minileg .ml.on{color:var(--ink);font-weight:600}
.minileg .ml.on.g i{background:var(--green)} .minileg .ml.on.y i{background:var(--yellow)} .minileg .ml.on.r i{background:var(--red)}
.kpi .v{font-size:24px;font-weight:700;color:var(--navy);line-height:1.2;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:3px}
.kpi.g{border-left-color:var(--green)} .kpi.y{border-left-color:var(--yellow)} .kpi.r{border-left-color:var(--red)}

/* Alertas e insights */
.alert{background:#FDECEC;border:1px solid #F3C2C2;border-left:5px solid var(--red);color:#7E1C1C;padding:11px 14px;border-radius:3px}
.alert strong{display:block;margin-bottom:2px}
.ins{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.ins li{padding:8px 10px 8px 12px;border-radius:3px;border-left:4px solid var(--sky);background:#F6F9FC}
.ins li.ok{border-left-color:var(--green);background:#EEF8F2}
.ins li.warn{border-left-color:var(--yellow);background:#FFF8E6}
.ins li.bad{border-left-color:var(--red);background:#FDF0F0}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2.g12{grid-template-columns:minmax(300px,1fr) 2fr}
.chartbox{position:relative;height:270px}

/* Tabelas */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:#fff;background:var(--navy);padding:7px 9px;white-space:nowrap}
td{padding:6px 9px;border-bottom:1px solid #E7ECF1;vertical-align:middle}
tr:nth-child(even) td{background:#FAFBFD}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
table.compacta{width:auto;min-width:0}
table.compacta th,table.compacta td{padding:6px 14px;white-space:nowrap}
table.compacta td:first-child{min-width:190px}
table.compacta.classif{width:100%}
table.compacta.classif th,table.compacta.classif td{padding:6px 10px}
table.compacta.classif td:first-child{min-width:0}
table.compacta.classif th.n{white-space:normal;line-height:1.2}
tr.click{cursor:pointer} tr.click:hover td{background:var(--ice)}
.bar{height:8px;background:#E7ECF1;border-radius:4px;min-width:70px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--blue)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600}
.pill.g{background:#DDF1E5;color:#1D6B3D} .pill.y{background:#FFF0C7;color:#7A5600} .pill.r{background:#FAD9D9;color:#8E1F1F} .pill.x{background:#E7ECF1;color:var(--muted)}
.cat{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:3px;color:#fff;font-weight:700;font-size:12px}
.muted{color:var(--muted)} .small{font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.flags{display:flex;flex-wrap:wrap;gap:4px}
.flag{padding:5px 9px;border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--ink);font:inherit;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.flag i{display:inline-block;width:10px;height:10px;border-radius:2px;border:1px solid var(--line)}
.flag:hover{background:var(--ice)}
.flag.on{border-color:var(--navy);background:var(--ice);font-weight:600}
.flag.on i{border-color:transparent}
.flag.limpa{border-style:dashed;color:var(--muted)}
.selres{background:#F6F9FC;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:3px;padding:8px 12px;margin:0 0 10px;font-size:13px}
.selres .tit{font-weight:600;color:var(--navy);margin-bottom:5px}
.semrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.semc{background:#fff;border:1px solid var(--line);border-radius:3px;padding:4px 9px;cursor:pointer;font:inherit;font-size:12.5px;color:var(--ink);text-align:left}
.semc:hover{background:var(--ice)} .semc.on{border-color:var(--navy);background:var(--ice)}
.semc b{color:var(--navy)} .semc small{color:var(--muted)}

/* Estado vazio */
.empty{max-width:720px;margin:40px auto;text-align:left}
.empty h2{color:var(--navy);margin:0 0 8px;font-size:22px}
.empty ol{padding-left:20px;margin:12px 0 18px}
.empty li{margin-bottom:6px}

/* Painel lateral: critérios e arquivos */
.drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:#fff;box-shadow:-8px 0 24px rgba(14,42,71,.18);transform:translateX(105%);transition:transform .25s ease;z-index:20;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer header{background:var(--navy);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.drawer header h2{margin:0;font-size:16px;font-weight:600}
.drawer .body{padding:16px 18px;overflow:auto;display:grid;gap:18px}
.drawer h4{margin:0 0 8px;color:var(--navy);font-size:13.5px}
.warnbox{background:#FFF8E6;border-left:4px solid var(--yellow);padding:8px 10px;font-size:12.5px;border-radius:3px}
dialog#dlgConf{border:none;border-radius:6px;padding:0;width:min(640px,94vw);max-height:86vh;box-shadow:0 12px 40px rgba(14,42,71,.3)}
dialog#dlgConf::backdrop{background:rgba(14,42,71,.45)}
.conf-head{background:var(--navy);color:#fff;padding:14px 18px}
.conf-head h2{margin:0;font-size:16px}
.conf-body{padding:12px 18px;overflow:auto;max-height:58vh}
.conf-body h4{margin:12px 0 6px;color:var(--navy);font-size:13px}
.conf-body label{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid #EEF2F6;font-size:13px;cursor:pointer}
.conf-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:4px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}

@media (max-width:1200px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.sema{grid-template-columns:auto 1fr}.sema .col:nth-child(3),.sema .col.acao{grid-column:1/-1}}
@media (max-width:1000px){.sema.mini{grid-template-columns:auto 1fr}.sema.mini .col:nth-child(3){grid-column:1/-1}}
@media (max-width:820px){.sema-minis,.hero,.grid2,.grid2.g12{grid-template-columns:1fr}.mode{margin-left:0}}
@media (max-width:480px){.kpis{grid-template-columns:1fr}.top,.slicers,.wrap{padding-left:12px;padding-right:12px}}
@media (prefers-reduced-motion:reduce){.drawer,.toast{transition:none}}
</style>
</head>
<body>

<header class="top">
  <div>
    <h1>Execução da visitação por categoria</h1>
    <p id="sub">Os médicos prioritários estão recebendo a visita primeiro?</p>
  </div>
  <div class="actions">
    <button class="btn primary" id="btnPainel">Carregar arquivos</button>
    <button class="btn" id="btnCfg">Critérios e arquivos</button>
    <button class="btn" id="btnLimparTop" hidden>Limpar arquivos</button>
    <input type="file" id="inPainel" accept=".xlsx,.xls,.xlsm,.csv" multiple hidden>
  </div>
</header>

<div class="slicers" id="slicers" hidden>
  <label class="field">Setor<select id="selSetor"></select></label>
  <label class="field">Ciclo<select id="inCiclo"></select></label>
  <label class="field">Visitas até<input type="date" id="inRef"></label>
  <span class="small muted" id="momentoTxt" style="padding-bottom:7px"></span>
  <span class="mode" id="modeBadge"></span>
</div>

<main class="wrap" id="app"></main>

<aside class="drawer" id="drawer" aria-label="Critérios e arquivos">
  <header><h2>Critérios e arquivos</h2><button class="btn" id="btnClose">Fechar</button></header>
  <div class="body" id="drawerBody"></div>
</aside>
<div class="toast" id="toast"></div>
<dialog id="dlgConf" aria-label="Conferir TOP 1"></dialog>

<script>
/* =====================================================================
   1. CONFIGURAÇÃO — pesos, limites do semáforo e ritmo do ciclo
   (tudo editável em "Critérios e arquivos")
   ===================================================================== */
const CFG = {
  escala: 'auto',                     // 'auto' (maior categoria usada nos painéis), 4 (1 a 4) ou 5 (1 a 5)
  pesos: {1:5, 2:4, 3:3, 4:2, 5:1},   // peso de cada categoria no índice; recalculado pela escala (1ª = maior peso)
  metaFinal: 90,                      // % do TOP 1 no fim do ciclo (curvas antecipada, linear e fixa)
  tolerancia: 15,                     // até quantos p.p. abaixo da meta da semana o sinal fica amarelo
  curva: 'prazo',                     // prazo: TOP 1 visitados até a semana X | antecipada | linear | fixa
  marcos: [{sem:2, meta:90}, {sem:4, meta:100}],   // curva 'prazo': % acumulado do TOP 1 até o fim de cada semana-marco
  semanaAtual: 2,
  dia: 5,                             // último dia da semana contido nos dados (0 = semana não iniciada; 5 = sexta, semana completa)
  jornada: {1:['08:00','18:00'], 2:['08:00','18:00'], 3:['08:00','18:00'], 4:['08:00','18:00'], 5:['08:00','14:00']},
  semanasCiclo: 4
};
/* Calendário da Força de Vendas 2026.
   Cada ciclo: início, fim e dias de reunião (não contam como dia de campo).
   Dia útil: segunda a quinta = 1; sexta = 0,5 (campo até as 14h); feriados, pontes e férias = 0.
   Os totais conferem com o calendário oficial (ex.: 9º ciclo = 20,5 dias úteis).
   Para 2027, acrescente os ciclos e feriados do novo calendário nas listas abaixo. */
const CALENDARIO = {
  feriados: ['2026-01-01','2026-01-02','2026-01-05','2026-02-16','2026-02-17','2026-02-18','2026-02-19','2026-02-20','2026-04-03','2026-04-20','2026-04-21',
             '2026-05-01','2026-06-04','2026-06-05','2026-09-07','2026-10-12','2026-11-02','2026-11-20','2026-12-24','2026-12-25','2026-12-28','2026-12-29',
             '2026-12-30','2026-12-31','2027-01-01','2027-01-04','2027-01-05','2027-01-06'],
  ciclos: [
    {n:1,  ini:'2026-01-13', fim:'2026-02-02', reuniao:[]},
    {n:2,  ini:'2026-02-03', fim:'2026-03-09', reuniao:['2026-02-03','2026-02-04']},
    {n:3,  ini:'2026-03-10', fim:'2026-04-06', reuniao:['2026-03-10']},
    {n:4,  ini:'2026-04-07', fim:'2026-05-04', reuniao:['2026-04-07']},
    {n:5,  ini:'2026-05-05', fim:'2026-06-08', reuniao:['2026-05-05']},
    {n:6,  ini:'2026-06-09', fim:'2026-07-06', reuniao:['2026-06-09']},
    {n:7,  ini:'2026-07-07', fim:'2026-08-03', reuniao:['2026-07-07']},
    {n:8,  ini:'2026-08-04', fim:'2026-08-31', reuniao:['2026-08-04']},
    {n:9,  ini:'2026-09-01', fim:'2026-10-05', reuniao:['2026-09-01']},
    {n:10, ini:'2026-10-06', fim:'2026-11-03', reuniao:['2026-10-06']},
    {n:11, ini:'2026-11-04', fim:'2026-11-30', reuniao:['2026-11-04']},
    {n:12, ini:'2026-12-01', fim:'2027-01-11', reuniao:['2026-12-01','2027-01-11']}
  ]
};
const DU_SEMANA = 4.5;   // uma semana de campo = seg a qui (4) + sexta (0,5)
let CATS = [1,2,3,4,5];   // categorias da escala em uso (recalculado a cada render)
let ESC = 5;
/* Escala efetiva: fixa (4 ou 5) ou automática pela maior categoria preenchida nos painéis.
   Com escala fixa em 4, um "5" no painel é lido como 4 (a categoria mais baixa). */
const escalaUsada = docs => docs.reduce((m, d) => Math.max(m, d.catOrig ?? d.cat ?? 0), 0);
function atualizarEscala(){
  const usada = escalaUsada(S.panels.flatMap(p => p.docs));
  ESC = CFG.escala === 'auto' ? (usada ? Math.max(4, usada) : 5) : +CFG.escala;
  CATS = Array.from({length: ESC}, (_, i) => i + 1);
  if (!S.pesosManual){ CFG.pesos = {}; CATS.forEach(c => CFG.pesos[c] = ESC - c + 1); }
}
const CAT_COR = {1:'#0E2A47', 2:'#1F5FA8', 3:'#6FA8DC', 4:'#A9C8E8', 5:'#D3E3F3', 0:'#C4CCD5'};
const FONT = '"Segoe UI","Source Sans 3",system-ui,Arial,sans-serif';

/* =====================================================================
   2. ESTADO
   ===================================================================== */
const S = {
  panels: [],   // {id, file, setor, docs[], abas, manual, auto}
  stats: [],    // {id, file, setor, kind:'agg'|'med', rows|byCrm/byNome}
  erros: [],    // arquivos não reconhecidos
  labels: {},   // setor -> nome do propagandista
  espMap: {},   // setor -> {especialidade do painel: especialidade da estatística} (ligação manual)
  setor: 'ALL',
  fCat: [], fEsp: 'all', fSem: 'all', fVis: 'all', fCid: 'all', q: '',
  ciclo: null, inicio: null, inicioManual: false,   // sequência de visitação
  charts: {}
};
let UID = 0;

/* Confirmação manual dos TOP 1 visitados (quando a estatística é por especialidade).
   Guardada no próprio navegador, por setor: {setor: [chave do médico, ...]} */
const CHAVE_CONF = 'execVisitacao.confirmacoes.v1';
S.confirm = (() => { try { const o = JSON.parse(localStorage.getItem(CHAVE_CONF) || '{}'); const m = {}; Object.keys(o).forEach(k => m[k] = new Set(o[k])); return m; } catch(e){ return {}; } })();
function salvarConfirm(){ try { const o = {}; Object.keys(S.confirm).forEach(k => { if (S.confirm[k].size) o[k] = [...S.confirm[k]]; }); localStorage.setItem(CHAVE_CONF, JSON.stringify(o)); } catch(e){} }
const docKey = d => (d.crm || d.nomeK) + '|' + d.espK;

/* =====================================================================
   3. UTILITÁRIOS
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim();
const normNome = s => norm(s).replace(/^(DRA|DR|DOUTORA|DOUTOR)\s+/,'');
const crmKey = s => { const d = String(s ?? '').replace(/\D/g,'').replace(/^0+/,''); return d.length >= 3 ? d : ''; };
const pct = (a,b) => b > 0 ? a/b : null;
const fp = v => v == null || isNaN(v) ? '–' : Math.round(v*100) + '%';
const fn = v => v == null || isNaN(v) ? '–' : Math.round(v).toLocaleString('pt-BR');
const parseCat = v => { const m = String(v ?? '').match(/[1-5]/); return m ? +m[0] : 0; };
const num = v => {
  if (typeof v === 'number') return v;
  const s = String(v ?? '').trim(); if (!s) return NaN;
  const n = parseFloat(s.replace(/\.(?=\d{3}\b)/g,'').replace(',','.').replace(/[^\d.\-]/g,''));
  return isNaN(n) ? NaN : n;
};
const pctNum = v => { // aceita 0,45 / 45 / "45%"
  if (typeof v === 'number') return v <= 1 ? v : v/100;
  const n = num(v); if (isNaN(n)) return NaN;
  return String(v).includes('%') || n > 1 ? n/100 : n;
};
const semCor = s => ({verde:'g', amarelo:'y', vermelho:'r', confirmar:'b'}[s] || 'x');
const semTxt = s => ({verde:'Verde', amarelo:'Amarelo', vermelho:'Vermelho', confirmar:'A confirmar'}[s] || 'Sem TOP 1');
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }

/* Datas */
function parseData(v){
  if (v == null || v === '') return null;
  if (v instanceof Date) return isNaN(v) ? null : new Date(v.getFullYear(), v.getMonth(), v.getDate());
  if (typeof v === 'number' && v > 20000 && v < 80000){ const d = new Date(Math.round((v - 25569) * 864e5)); return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); }
  const m = String(v).match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (!m) return null;
  const y = +m[3] < 100 ? 2000 + +m[3] : +m[3];
  return new Date(y, +m[2] - 1, +m[1]);
}
const fmtD = d => d ? `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth() + 1).padStart(2,'0')}` : '';
const segundaDe = d => { const x = new Date(d); const w = (x.getDay() + 6) % 7; x.setDate(x.getDate() - w); return x; };
const semanaDe = (d, ini) => Math.floor((segundaDe(d) - segundaDe(ini)) / (7 * 864e5) + 0.5) + 1;   // semana 1 = semana do início do ciclo
const diaUtil = d => { const w = d.getDay(); return w === 0 || w === 6 ? 5 : w; };

/* =====================================================================
   4. LEITURA DAS PLANILHAS (SheetJS)
   ===================================================================== */
const readAoa = ws => XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:true, blankrows:false});
function findHeader(aoa, test, max = 25){
  for (let i = 0; i < Math.min(max, aoa.length); i++) if (test(aoa[i].map(norm), aoa[i])) return i;
  return -1;
}
const cel = (c, re) => c.length <= 40 && re.test(c);            // célula de cabeçalho (não um título longo)
const cheios = H => H.filter(c => c).length;
const ehCrm = c => cel(c, /\bCRM\b/);
const colIdx = (H, re, excl, from = 0) => H.findIndex((c,i) => i >= from && re.test(c) && !(excl && excl.test(c)));
function pickNome(H){
  let i = H.findIndex((c,j) => j > 0 && /^(NOME|NOME DO MEDICO|NOME MEDICO|MEDICO|PROFISSIONAL)$/.test(c));
  if (i < 0) i = H.findIndex((c,j) => j > 0 && /NOME|MEDICO/.test(c) && !/ESPECIAL|TIPO|FANTASIA|LOCAL|VISIT|INSTITU|CLINICA/.test(c));
  return i;
}
function pickCrm(H){
  let i = H.findIndex(c => c === 'CRM');
  if (i < 0) i = H.findIndex(c => /\bCRM\b/.test(c) && !/\bUF\b/.test(c));
  return i;
}
function detSetorNome(fname){ const m = String(fname).match(/(?<!\d)(\d{6})(?!\d)/); return m ? m[1] : ''; }
function detSetorConteudo(wb){
  for (const sn of wb.SheetNames){
    const aoa = readAoa(wb.Sheets[sn]).slice(0, 12);
    const txt = aoa.map(r => r.join(' ')).join(' ');
    const m = txt.match(/setor\D{0,15}(\d{6})(?!\d)/i);
    if (m) return m[1];
  }
  return '';
}
function rotuloArquivo(fname){
  return '';   // o nome do arquivo não vira rótulo: o setor aparece só pelo código (o nome do PV, quando houver, vem da aba do painel)
}
function rotuloArquivoAntigo(fname){
  const base = String(fname).replace(/\.[^.]+$/,'');
  const r = norm(base).replace(/\b(PAINEL|MEDICOS?|DISTRITAL|ESTATISTICAS?|VISITACAO|VISITAS?|POR|ESPECIALIDADES?|CATEGORIZACAO|CATEGORIAS?|CLASSIFICACAO|DE|DO|DA|DOS|DAS|SETOR|SETORES|COPIA|FINAL|PV|GD)\b/g,' ')
    .replace(/\d+/g,' ').replace(/\s+/g,' ').trim();
  return r;   // vazio quando o nome do arquivo só tem termos genéricos e o código
}

/* Especialidade canônica: faz "GINECOLOGIA E OBSTETRICIA", "GO" e "GOB" caírem na mesma chave */
const ESP_ALIAS = [
  ['NCI', /NEUROCIR/], ['GOB', /GINEC|OBSTET|^GOB?$|^GIN\b/], ['ORT', /ORTOP|TRAUMAT|^ORT\b/], ['PSI', /PSIQ|^PSI\b/],
  ['NEU', /NEUROL|^NEU\b|^NRL\b/], ['URO', /UROL|^URO\b/], ['CLM', /CLINICA MEDICA|CLINICO GERAL|CLINICA GERAL|MEDICINA INTERNA|^CLM\b|^CG\b|^CLI\b/],
  ['CAR', /CARDIO|^CAR\b/], ['END', /ENDOCRIN|^END\b/], ['DER', /DERMAT|^DER\b/], ['PED', /PEDIAT|^PED\b/], ['GER', /GERIAT|^GER\b/],
  ['GAS', /GASTRO|^GAS\b|^GEN\b/], ['REU', /REUMAT|^REU\b/], ['PNE', /PNEUMO|^PNE\b/], ['OFT', /OFTAL|^OFT\b/], ['OTO', /OTORRIN|^OTO\b|^ORL\b/],
  ['NEF', /NEFRO|^NEF\b/], ['ANG', /ANGIO|VASCULAR|^ANG\b/], ['MFC', /FAMILIA|^MFC\b/], ['ONC', /ONCO|^ONC\b/], ['INF', /INFECTO|^INF\b/],
  ['HEM', /HEMATO|^HEM\b/], ['MAS', /MASTO|^MAS\b/], ['CIR', /CIRURG|^CIR\b/]
];
function canonEsp(txt){
  const n = norm(txt);
  for (const [cod, re] of ESP_ALIAS) if (re.test(n)) return cod;
  return n;
}

/* Aba com nome genérico ("Worksheet", "Planilha1", "ESTATÍSTICAS DE VISITAÇÃO...") não identifica setor nem PV */
const abaGenerica = sn => { const n = norm(sn); return !n || /^(SHEET|PLANILHA|PLAN|WORKSHEET|FOLHA|DADOS|BASE)\s*\d*$/.test(n) || /ESTATIST|VISITAC|PAINEL|ESPECIALIDADE/.test(n); };

/* Identifica o tipo do arquivo pelo conteúdo e, como desempate, pelo nome.
   - Estatística por especialidade: cabeçalho com Especialidade + Visitas/Cadastros/Cobertura
   - Painel médico: cabeçalho com Nome/CRM e categoria na 1ª coluna (CATEGORIA, IMPORTÂNCIA, TOP...)
   - Relatório de visitas por médico: Nome/CRM com coluna de visitas e sem categoria -> tratado como estatística */
function detectarTipo(wb, fname){
  let painel = 0, estat = 0;
  for (const sn of wb.SheetNames){
    const aoa = readAoa(wb.Sheets[sn]).slice(0, 30);
    // agregado por especialidade: tem Especialidade + Visitas/Cadastros e NÃO tem médico (CRM/Nome)
    if (findHeader(aoa, H => !H.some(ehCrm) && !H.some(c => /^(NOME|NOME DO MEDICO|NOME MEDICO|MEDICO)$/.test(c)) && H.some((c,i) => cel(c, /ESPECIAL/) && H.some((d,j) => j !== i && cel(d, /VISIT|COBERT|CADASTR/)))) >= 0){ estat += 2; continue; }
    const h = findHeader(aoa, H => cheios(H) >= 2 && (H.some(ehCrm) || H.some(c => /^(NOME|NOME DO MEDICO|NOME MEDICO|MEDICO)$/.test(c))));
    if (h < 0) continue;
    const H = aoa[h].map(norm);
    if (/^CAT\b|CATEG|IMPORT|CLASSIF|PRIOR|TOP|NIVEL/.test(H[0])) painel += 2;
    else if (H.some(c => cel(c, /VISIT|QTD|QUANT|FREQ/))) estat += 1;
    else painel += 1;
  }
  const n = norm(fname);
  if (/PAINEL/.test(n)) painel += 0.5;
  if (/ESTATIST|VISITAC|VISITAS/.test(n)) estat += 0.5;
  if (!painel && !estat) return '';
  return estat > painel ? 'estat' : 'painel';
}

/* Valor da coluna de visita do painel: data, "S", "SIM", "X", 1 = visitado; vazio, "N", "NÃO", 0 = não visitado */
function marcaVisita(v){
  if (v == null || v === '') return false;
  if (typeof v === 'number') return v > 0;
  if (v instanceof Date) return true;
  return !/^(N|NAO|0|-|FALSO|FALSE)$/.test(norm(v));
}

/* 4a. Painel médico distrital: uma aba por propagandista (nome da aba = PV),
   categoria na coluna A, cabeçalho CATEGORIA | Nome Médico | Especialidade | CRM | ... */
function parsePainel(wb){
  const grupos = [];
  for (const sn of wb.SheetNames){
    const aoa = readAoa(wb.Sheets[sn]);
    const h = findHeader(aoa, H => cheios(H) >= 2 && (H.some(ehCrm) || H.some((c,i) => i > 0 && /^(NOME|NOME DO MEDICO|NOME MEDICO|MEDICO)$/.test(c))));
    if (h < 0) continue;
    const H = aoa[h].map(norm);
    const iN = pickNome(H), iC = pickCrm(H);
    const iE = colIdx(H, /ESPECIAL/, null, 1), iCid = colIdx(H, /CIDADE|MUNICIP/, null, 1);
    const iS = colIdx(H, /^SETOR$|COD SETOR|SETOR COD/, null, 1);   // coluna Setor (opcional)
    const iVis = H.findIndex((c, i) => i > 0 && cel(c, /VISITAD|DATA( DA)?( ULTIMA)? VISITA|ULTIMA VISITA|^VISITA$/));   // coluna de visita (opcional)
    if (iN < 0 && iC < 0) continue;
    const porSetor = new Map();   // setor da linha -> {docs, seen, dup}
    for (let r = h + 1; r < aoa.length; r++){
      const row = aoa[r];
      const nome = iN >= 0 ? String(row[iN] ?? '').trim() : '';
      const crm = iC >= 0 ? crmKey(row[iC]) : '';
      if (!nome && !crm) continue;
      if (/^TOTAL/.test(norm(nome))) continue;
      const espTxt = iE >= 0 && String(row[iE] ?? '').trim() ? String(row[iE]).trim() : sn;
      const d = { cat: parseCat(row[0]), catRaw: String(row[0] ?? '').trim(), nome, nomeK: normNome(nome), crm,
                  esp: espTxt, espK: canonEsp(espTxt), cidade: iCid >= 0 ? String(row[iCid] ?? '').trim() : '',
                  visPainel: iVis >= 0 ? marcaVisita(row[iVis]) : null };
      const st = iS >= 0 ? ((String(row[iS] ?? '').match(/(?<!\d)(\d{6})(?!\d)/) || [])[1] || '') : '';
      if (!porSetor.has(st)) porSetor.set(st, {docs: [], seen: new Set(), dup: 0});
      const g = porSetor.get(st);
      const k = (crm || d.nomeK) + '|' + d.espK;
      if (g.seen.has(k)){ g.dup++; continue; }   // duplicado dentro da mesma aba/setor
      g.seen.add(k); g.docs.push(d);
    }
    porSetor.forEach((g, st) => { if (g.docs.length) grupos.push({aba: sn, setor: st, docs: g.docs, dup: g.dup}); });
  }
  return grupos;
}

/* 4b. Estatística de visitação.
   Reconhece dois formatos:
   - agregado por especialidade (Especialidade / Cadastrados / Visitados / % Cobertura)
   - por médico (qualquer planilha com CRM ou nome do médico) -> cobertura exata  */
function parseEstatistica(wb, fname){
  const setorArq = detSetorNome(fname) || detSetorConteudo(wb);
  const agg = new Map(), med = new Map(), rotulos = new Map(); let usouVisitas = false;
  let abaAtual = '';
  // Ordem: coluna Setor da linha > código no nome da aba > código no arquivo > nome da aba (ex.: nome do PV)
  const setorDe = (row, iS) => {
    if (iS >= 0){ const m = String(row[iS] ?? '').match(/(?<!\d)(\d{6})(?!\d)/); if (m) return m[1]; }
    return detSetorNome(abaAtual) || setorArq || (abaGenerica(abaAtual) ? '' : abaAtual.trim());
  };
  const guardaRotulo = st => { if (!rotulos.has(st)) rotulos.set(st, abaGenerica(abaAtual) || detSetorNome(abaAtual) ? rotuloArquivo(fname) : abaAtual.trim()); };

  for (const sn of wb.SheetNames){
    abaAtual = sn;
    const aoa = readAoa(wb.Sheets[sn]);

    // Formato por médico
    let h = findHeader(aoa, H => cheios(H) >= 2 && (H.some(ehCrm) || H.some(c => /^(NOME|NOME DO MEDICO|NOME MEDICO|MEDICO)$/.test(c))));
    if (h >= 0){
      const H = aoa[h].map(norm);
      const iN = pickNome(H) >= 0 ? pickNome(H) : H.findIndex(c => /^(NOME|MEDICO)/.test(c));
      const iC = pickCrm(H);
      const iQ = colIdx(H, /VISIT|QTD|QUANT|FREQ/, /DATA|ULTIMA|TIPO/);
      const iS = colIdx(H, /^SETOR$|COD SETOR|SETOR COD/);
      // Sequência de visitação: uma coluna por ciclo (C 01, C 02...) com a data da visita
      const iCic = H.map((c, i) => /^C ?\d{1,2}$|^CICLO ?\d{1,2}$/.test(c) ? i : -1).filter(i => i >= 0);
      const iSt = colIdx(H, /EXCLU|STATUS|SITUAC/);
      for (let r = h + 1; r < aoa.length; r++){
        const row = aoa[r];
        const nomeK = iN >= 0 ? normNome(row[iN]) : '', crm = iC >= 0 ? crmKey(row[iC]) : '';
        if (!nomeK && !crm) continue;
        let q = iQ >= 0 ? num(row[iQ]) : 1; if (isNaN(q)) q = 1;
        const st = setorDe(row, iS); guardaRotulo(st);
        if (!med.has(st)) med.set(st, {byCrm:new Map(), byNome:new Map()});
        const b = med.get(st);
        if (iCic.length){
          if (!b.seq){ b.seq = new Map(); b.ciclos = iCic.map(i => norm(aoa[h][i]).replace(/^CICLO ?/, 'C ').replace(/^C ?(\d)$/, 'C 0$1').replace(/^C(\d)/, 'C $1')); }
          const k = crm || ('N:' + nomeK);
          const rec = b.seq.get(k) || {crm, nomeK, ciclos:{}, status:''};
          iCic.forEach((i, j) => { const d = parseData(row[i]); if (d){ const c = b.ciclos[j]; (rec.ciclos[c] = rec.ciclos[c] || []).push(d); } });
          const stt = iSt >= 0 ? String(row[iSt] ?? '').trim() : '';
          if (stt && !/^EXCLUIDO$/.test(norm(stt))) rec.status = stt; else if (stt && !rec.status) rec.status = stt;
          b.seq.set(k, rec);
          continue;
        }
        if (crm) b.byCrm.set(crm, (b.byCrm.get(crm) || 0) + q);
        if (nomeK) b.byNome.set(nomeK, (b.byNome.get(nomeK) || 0) + q);
      }
      continue;
    }

    // Formato agregado por especialidade
    h = findHeader(aoa, H => H.some((c,i) => cel(c, /ESPECIAL/) && H.some((d,j) => j !== i && cel(d, /VISIT|COBERT/))));
    if (h < 0) continue;
    const H = aoa[h].map(norm), raw = aoa[h].map(v => String(v ?? ''));
    const temPct = i => /%/.test(raw[i]) || /COBERT|PERC/.test(H[i]);
    const iE = colIdx(H, /ESPECIAL/);
    let iV = H.findIndex((c,i) => /VISITAD/.test(c) && /MEDIC/.test(c) && !temPct(i));
    if (iV < 0) iV = H.findIndex((c,i) => /VISITAD/.test(c) && !temPct(i));
    if (iV < 0){ iV = H.findIndex((c,i) => /VISITA/.test(c) && !temPct(i)); if (iV >= 0 && !H.some((c,i) => temPct(i))) usouVisitas = true; }
    let iCad = H.findIndex((c,i) => /CADASTR/.test(c) && !temPct(i));
    if (iCad < 0) iCad = colIdx(H, /^(TOTAL|QTD MEDICOS|MEDICOS|TOTAL MEDICOS|UNIVERSO|QTD)$/);
    const iCob = H.findIndex((c,i) => temPct(i) && i !== iE);
    const iS = colIdx(H, /^SETOR$|COD SETOR|SETOR COD/);
    for (let r = h + 1; r < aoa.length; r++){
      const row = aoa[r];
      const esp = String(row[iE] ?? '').trim();
      if (!esp || /^TOTAL/.test(norm(esp))) continue;
      const cad = iCad >= 0 ? num(row[iCad]) : NaN;
      let vis = iV >= 0 ? num(row[iV]) : NaN;
      if (isNaN(vis) && iCob >= 0 && !isNaN(cad)) vis = Math.round(cad * pctNum(row[iCob]));
      if (isNaN(vis)) continue;
      const st = setorDe(row, iS); guardaRotulo(st);
      if (!agg.has(st)) agg.set(st, new Map());
      const m = agg.get(st), k = canonEsp(esp);
      const p = m.get(k) || {esp, cad: isNaN(cad) ? null : 0, vis: 0};
      if (!isNaN(cad)) p.cad = (p.cad || 0) + cad;
      p.vis += vis;
      m.set(k, p);
    }
  }
  const out = [];
  agg.forEach((rows, st) => out.push({id: ++UID, file: fname, kind:'agg', setor: st, rows, usouVisitas, rotulo: rotulos.get(st) || rotuloArquivo(fname), rotuloDaAba: rotulos.get(st) !== rotuloArquivo(fname)}));
  med.forEach((b, st) => out.push({id: ++UID, file: fname, kind:'med', setor: st, byCrm: b.byCrm, byNome: b.byNome, seq: b.seq || null, ciclos: b.ciclos || null, rotulo: rotulos.get(st) || rotuloArquivo(fname), rotuloDaAba: rotulos.get(st) !== rotuloArquivo(fname)}));
  return out;
}

/* Sobrepõe uma nova versão do painel de um PV: categoria preenchida no arquivo novo prevalece */
function sobreporPainel(ex, novo, fname){
  const idx = new Map(ex.docs.map(d => [(d.crm || d.nomeK) + '|' + d.espK, d]));
  let atualizadas = 0, novos = 0;
  novo.docs.forEach(d => {
    const k = (d.crm || d.nomeK) + '|' + d.espK, a = idx.get(k);
    if (!a){ ex.docs.push(d); novos++; return; }
    if (d.cat && d.cat !== a.cat){ a.cat = d.cat; a.catRaw = d.catRaw; atualizadas++; }
  });
  if (!ex.setor && novo.setor) ex.setor = novo.setor;
  if (!ex.setorDet && novo.setorDet) ex.setorDet = novo.setorDet;
  ex.fontes = (ex.fontes || [ex.file]).concat(fname);
  toast(`${ex.rotulo}: ${atualizadas} categorias atualizadas${novos ? `, ${novos} médicos novos` : ''}`);
}

/* 4c. Vínculo automático painel -> setor, quando o painel não traz o código:
   compara a distribuição de médicos por especialidade com a da estatística (cosseno). */
function autoVincular(){
  // Distribuição de cadastros por especialidade de cada estatística (por setor)
  const porSetor = new Map();
  S.stats.filter(s => s.kind === 'med' && s.setor).forEach(a => { if (!porSetor.has(a.setor)) porSetor.set(a.setor, {}); });
  S.stats.filter(s => s.kind === 'agg' && s.setor).forEach(a => {
    const v = porSetor.get(a.setor) || {};
    a.rows.forEach((r, k) => v[k] = (v[k] || 0) + (r.cad ?? r.vis));
    porSetor.set(a.setor, v);
  });
  const cos = (va, vb) => {
    const ks = new Set([...Object.keys(va), ...Object.keys(vb)]); let d = 0, na = 0, nb = 0;
    ks.forEach(k => { const x = va[k] || 0, y = vb[k] || 0; d += x*y; na += x*x; nb += y*y; });
    return na && nb ? d / Math.sqrt(na*nb) : 0;
  };
  // Candidatos: painéis sem setor ou com um setor que não tem estatística (ex.: código da distrital no nome)
  const livres = S.panels.filter(p => !p.manual && (!p.setor || !porSetor.has(p.setor)));
  livres.forEach(p => { if (p.setor){ p.setor = ''; p.auto = false; } });
  const ocupados = new Set(S.panels.filter(p => p.setor).map(p => p.setor));
  // 1º critério: o nome do PV (aba) aparece no nome do arquivo da estatística
  S.stats.filter(s => s.setor && !ocupados.has(s.setor)).forEach(s => {
    const alvo = ' ' + norm(s.file) + ' ' + norm(s.rotulo) + ' ' + norm(s.setor) + ' ';
    const cand = livres.filter(p => !p.setor && norm(p.rotulo).length >= 3 && alvo.includes(' ' + norm(p.rotulo) + ' '));
    if (cand.length === 1){
      const p = cand[0]; p.setor = s.setor; p.auto = true; p.porNome = true; ocupados.add(s.setor);
      if (!S.labels[s.setor] || S.labels[s.setor] === s.setor) S.labels[s.setor] = p.rotulo;
    }
  });
  // Relatórios por médico (ex.: sequência de visitação) não têm especialidade agregada:
  // compara pelos médicos em comum (CRM ou nome) — quanto dos visitados está no painel.
  const medSetor = new Map();
  S.stats.filter(s => s.kind === 'med' && s.setor).forEach(s => {
    const m = medSetor.get(s.setor) || {crm:new Set(), nome:new Set()};
    s.byCrm.forEach((_, x) => m.crm.add(x)); s.byNome.forEach((_, x) => m.nome.add(x));
    medSetor.set(s.setor, m);
  });
  const sobrep = (p, m) => {
    const tot = m.crm.size + m.nome.size; if (!tot) return 0;
    let n = 0; p.docs.forEach(d => { if ((d.crm && m.crm.has(d.crm)) || (d.nomeK && m.nome.has(d.nomeK))) n++; });
    return Math.min(1, n / Math.min(tot, p.docs.length || 1));
  };
  const pares = [];
  livres.filter(p => !p.setor).forEach(p => {
    const vp = {}; p.docs.forEach(d => vp[d.espK] = (vp[d.espK] || 0) + 1);
    porSetor.forEach((va, st) => { if (!ocupados.has(st)) pares.push({p, st, sim: Math.max(cos(vp, va), medSetor.has(st) ? sobrep(p, medSetor.get(st)) : 0)}); });
  });
  // atribuição gulosa: o par mais parecido primeiro, cada aba e cada setor usados uma vez
  pares.sort((x, y) => y.sim - x.sim);
  const usadosP = new Set();
  for (const {p, st, sim} of pares){
    if (sim < 0.75 || usadosP.has(p.id) || ocupados.has(st)) continue;
    p.setor = st; p.auto = true; p.sim = sim; usadosP.add(p.id); ocupados.add(st);
    if (!S.labels[st] || S.labels[st] === st) S.labels[st] = p.rotulo;
  }
  // Sobrou exatamente um painel sem setor e uma estatística sem painel: liga os dois
  const livresP = S.panels.filter(p => !p.setor && !p.manual);
  if (livresP.length === 1){
    const p = livresP[0];
    const statsSetor = [...new Set(S.stats.filter(s => s.setor).map(s => s.setor))].filter(st => !S.panels.some(q => q.setor === st));
    const statsSem = S.stats.filter(s => !s.setor && !s.manual);
    if (statsSetor.length === 1 && !statsSem.length){ p.setor = statsSetor[0]; p.auto = true; }
    else if (!statsSetor.length && statsSem.length && new Set(statsSem.map(s => s.file)).size === 1){
      p.setor = p.rotulo; p.auto = true; statsSem.forEach(s => s.setor = p.rotulo);
    }
    if (p.setor && (!S.labels[p.setor] || S.labels[p.setor] === p.setor)) S.labels[p.setor] = p.rotulo;
  }
  S.panels.forEach(p => { if (!p.setor && !p.manual && p.setorDet){ p.setor = p.setorDet; p.auto = false; } });
}

/* =====================================================================
   5. CRUZAMENTO E CÁLCULO
   ===================================================================== */
const keyP = p => p.setor || ('SEM-' + p.id);
const keyS = s => s.setor || ('EST-' + s.id);
function setorKeys(){
  const ks = new Set();
  S.panels.forEach(p => ks.add(keyP(p)));
  S.stats.forEach(s => ks.add(keyS(s)));
  return [...ks].sort();
}
function nomeSetor(k){
  if (k.startsWith('SEM-')) return (S.labels[k] || 'Painel') + ' (sem estatística)';
  if (k.startsWith('EST-')) return 'Estatística sem setor';
  return S.labels[k] && S.labels[k] !== k ? `${k} ${S.labels[k]}` : k;
}
function vazio(key){
  const cats = {}; CATS.forEach(c => cats[c] = {cad:0, vis:0, min:0, max:0});
  return {key, mode:'', cats, sem:{cad:0, vis:0}, total:{cad:0, vis:0}, wBest:0, wWorst:0,
          esps:[], semEst:[], foraPainel:[], diverg:[], missPrio1:0, missPrio12:0, missEsps:[], visForaPainel:0, docs:[], usouVisitas:false};
}
/* Junta os painéis do setor (o último arquivo carregado prevalece para o mesmo médico) */
function docsDoSetor(k){
  const m = new Map();
  S.panels.filter(p => keyP(p) === k).forEach(p => p.docs.forEach(d => {
    const key = (d.crm || d.nomeK) + '|' + d.espK, a = m.get(key);
    const cat = d.cat || (a && a.catOrig) || d.cat;
    m.set(key, {...(a || {}), ...d, setor:k, catOrig:cat, cat: cat > ESC ? ESC : cat, catRaw: d.cat ? d.catRaw : (a ? a.catRaw : d.catRaw)});
  }));
  return [...m.values()];
}
function analisarSetor(k){
  const A = vazio(k);
  A.docs = docsDoSetor(k);
  const st = S.stats.filter(s => keyS(s) === k);
  const med = st.filter(s => s.kind === 'med').slice();
  const agg = st.filter(s => s.kind === 'agg').pop();
  // Painel com coluna de visita preenchida pelo PV vale como relatório por médico
  if (!med.length && A.docs.some(d => d.visPainel != null)){
    const byCrm = new Map(), byNome = new Map();
    A.docs.forEach(d => { if (d.visPainel){ if (d.crm) byCrm.set(d.crm, 1); else if (d.nomeK) byNome.set(d.nomeK, 1); } });
    med.push({kind:'med', byCrm, byNome}); A.fonteVisita = 'painel';
  }
  const W = CFG.pesos;
  if (!A.docs.length){ A.mode = 'sem-painel'; return A; }

  const porEsp = new Map();
  A.docs.forEach(d => { if (!porEsp.has(d.espK)) porEsp.set(d.espK, {esp:d.esp, docs:[]}); porEsp.get(d.espK).docs.push(d); });

  if (med.length){
    /* ---- MODO EXATO: casamento por CRM, depois por nome ---- */
    A.mode = 'exato';
    const byCrm = new Map(), byNome = new Map();
    med.forEach(s => { s.byCrm.forEach((v,x) => byCrm.set(x, (byCrm.get(x)||0) + v)); s.byNome.forEach((v,x) => byNome.set(x, (byNome.get(x)||0) + v)); });
    const usC = new Set(), usN = new Set();
    A.docs.forEach(d => {
      let v = 0;
      if (d.crm && byCrm.has(d.crm)){ v = byCrm.get(d.crm); usC.add(d.crm); }
      else if (d.nomeK && byNome.has(d.nomeK)){ v = byNome.get(d.nomeK); usN.add(d.nomeK); }
      d.visitas = v; d.visitado = v > 0;
      const rs = seqRec(med, d);
      if (rs){
        A.temSeq = true;
        d.datas = (rs.ciclos[S.ciclo] || []).filter(x => x <= S.T.ref).sort((a, b) => a - b);
        d.primeira = d.datas[0] || null; d.semana = d.primeira ? semanaDU(d.primeira, S.T.c) : null;
        const ant = S.ciclos.slice(0, S.ciclos.indexOf(S.ciclo)).flatMap(c => rs.ciclos[c] || []);
        d.ultAnterior = ant.length ? new Date(Math.max(...ant)) : null;
        d.status = /EXCLUIDO/.test(norm(rs.status)) ? '' : rs.status;
      }
      const b = d.cat ? A.cats[d.cat] : A.sem;
      b.cad++;
      if (v > 0){ b.vis++; if (d.cat){ b.min++; b.max++; } }
    });
    CATS.forEach(c => { A.wBest += W[c] * A.cats[c].vis; });
    A.wWorst = A.wBest;
    A.visForaPainel = byCrm.size ? [...byCrm.keys()].filter(x => !usC.has(x)).length : [...byNome.keys()].filter(x => !usN.has(x)).length;
    porEsp.forEach(g => {
      const n1 = g.docs.filter(d => d.cat === 1), n2 = g.docs.filter(d => d.cat === 2);
      const vis = g.docs.filter(d => d.visitado).length;
      const m1 = n1.filter(d => !d.visitado).length, m12 = m1 + n2.filter(d => !d.visitado).length;
      A.esps.push({esp:g.esp, N:g.docs.length, n1:n1.length, n2:n2.length, vis, cov:pct(vis, g.docs.length), miss1:m1, miss12:m12});
      if (m1){ A.missPrio1 += m1; A.missEsps.push(g.esp); }
      A.missPrio12 += m12;
    });
  } else if (agg){
    /* ---- MODO ESTIMADO: estatística só por especialidade ----
       Em cada especialidade, a taxa de cobertura oficial (visitados / cadastrados) é aplicada
       aos médicos de cada categoria (estimativa). A faixa mínima/máxima mostra o que é possível
       garantir: no pior caso as visitas foram para os de menor categoria; no melhor, para os de maior. */
    A.mode = 'estimado'; A.usouVisitas = agg.usouVisitas;
    const usadas = new Set();
    porEsp.forEach((g, ek) => {
      const mk = (S.espMap[k] || {})[ek] || ek;
      const r = agg.rows.get(mk);
      if (!r){ A.semEst.push({k:ek, esp:g.esp, n:g.docs.length}); return; }
      usadas.add(mk);
      const N = g.docs.length;
      const base = r.cad && r.cad > 0 ? r.cad : N;
      const rate = Math.max(0, Math.min(1, r.vis / base));
      const V = Math.min(N, Math.round(rate * N));
      if (r.cad != null && Math.abs(r.cad - N) / Math.max(r.cad, N) > 0.15) A.diverg.push(`${g.esp}: ${N} no painel, ${r.cad} na estatística`);
      const n = {0:0}; CATS.forEach(c => n[c] = 0); g.docs.forEach(d => { n[d.cat]++; d.rateEsp = rate; });
      CATS.forEach(c => {
        const b = A.cats[c];
        b.cad += n[c]; b.vis += n[c] * rate;
        b.min += Math.max(0, V - (N - n[c])); b.max += Math.min(n[c], V);
      });
      A.sem.cad += n[0]; A.sem.vis += n[0] * rate;
      // melhor caso: visitas vão primeiro para Cat 1, depois 2...; pior caso: sem categoria e Cat 5 primeiro
      let rem = V; CATS.forEach(c => { const t = Math.min(n[c], rem); A.wBest += W[c] * t; rem -= t; });
      rem = V; [0, ...[...CATS].reverse()].forEach(c => { const t = Math.min(n[c], rem); if (c) A.wWorst += W[c] * t; rem -= t; });
      const m1 = Math.max(0, n[1] - V), m12 = Math.max(0, n[1] + n[2] - V);
      A.esps.push({esp:g.esp, N, n1:n[1], n2:n[2], vis:r.vis, cad:r.cad, cov:rate, miss1:m1, miss12:m12});
      if (m1){ A.missPrio1 += m1; A.missEsps.push(g.esp); }
      A.missPrio12 += m12;
    });
    agg.rows.forEach((r, ek) => { if (!usadas.has(ek)) A.foraPainel.push({k:ek, esp:r.esp, vis:r.vis}); });
    // TOP 1 conferidos na lista do sistema: passam a valer como contagem exata
    const conf = S.confirm[k];
    if (conf && conf.size){
      const c1 = A.docs.filter(d => d.cat === 1 && d.rateEsp != null);
      c1.forEach(d => d.confirmado = conf.has(docKey(d)));
      const n = c1.filter(d => d.confirmado).length;
      A.cats[1].vis = A.cats[1].min = A.cats[1].max = n;
      A.confirmado = true;
    }
    A.statEsps = [...agg.rows].map(([ek, r]) => ({k:ek, esp:r.esp}));
  } else {
    A.mode = 'sem-estat';
    A.docs.forEach(d => (d.cat ? A.cats[d.cat] : A.sem).cad++);
  }
  A.total.cad = A.sem.cad + CATS.reduce((s,c) => s + A.cats[c].cad, 0);
  A.total.vis = A.sem.vis + CATS.reduce((s,c) => s + A.cats[c].vis, 0);
  A.classif = CATS.reduce((s,c) => s + A.cats[c].cad, 0);
  if ((A.mode === 'exato' || A.mode === 'estimado') && A.classif === 0) A.mode = 'sem-categoria';
  return A;
}
/* Consolida vários setores (visão distrital) */
function consolidar(lista){
  const A = vazio('ALL');
  A.partes = lista;
  if (!lista.length){ A.mode = 'vazio'; return A; }
  const modos = new Set(lista.map(a => a.mode));
  A.mode = modos.size === 1 ? [...modos][0] : 'misto';
  lista.forEach(a => {
    CATS.forEach(c => ['cad','vis','min','max'].forEach(f => A.cats[c][f] += a.cats[c][f]));
    A.sem.cad += a.sem.cad; A.sem.vis += a.sem.vis;
    A.total.cad += a.total.cad; A.total.vis += a.total.vis;
    A.wBest += a.wBest; A.wWorst += a.wWorst;
    A.missPrio1 += a.missPrio1; A.missPrio12 += a.missPrio12;
    a.missEsps.forEach(e => A.missEsps.push(lista.length > 1 ? `${e} (${a.key})` : e));
    a.esps.forEach(e => A.esps.push(lista.length > 1 ? {...e, esp: `${e.esp} (${S.labels[a.key] || a.key})`} : e));
    A.docs.push(...a.docs);
    A.usouVisitas = A.usouVisitas || a.usouVisitas;
    A.temSeq = A.temSeq || !!a.temSeq;
    A.confirmado = (A.confirmado || !!a.confirmado);
  });
  return A;
}

/* Meta acumulada de cobertura do TOP 1 na semana w.
   Antecipada: o grosso dos TOP 1 nas primeiras semanas (1 - (1 - w/n)²). Ex.: meta final 90% em 5 semanas = 32, 58, 76, 86, 90.
   Linear: mesma quantidade por semana. Fixa: a meta final vale desde a 1ª semana. */
/* ---- Tempo do ciclo pelo calendário (dias úteis) ---- */
const isoD = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dataIso = t => { const [y, m, d] = t.split('-').map(Number); return new Date(y, m - 1, d); };
const FERIADOS = new Set(CALENDARIO.feriados);
const cicloCal = n => { const c = CALENDARIO.ciclos.find(x => x.n === +n); return c ? {n: c.n, ini: dataIso(c.ini), fim: dataIso(c.fim), reuniao: new Set(c.reuniao)} : null; };
function duDia(d, c){
  const w = d.getDay(), k = isoD(d);
  if (w === 0 || w === 6 || FERIADOS.has(k) || (c && c.reuniao.has(k))) return 0;
  return w === 5 ? 0.5 : 1;
}
function duEntre(c, ate){ // dias úteis do início do ciclo até a data (inclusive)
  let t = 0; const fim = ate < c.fim ? ate : c.fim;
  for (let d = new Date(c.ini); d <= fim; d.setDate(d.getDate() + 1)) t += duDia(d, c);
  return t;
}
function fimDaSemana(c, k){ // data em que se completam k semanas de campo
  let t = 0;
  for (let d = new Date(c.ini); d <= c.fim; d.setDate(d.getDate() + 1)){ t += duDia(d, c); if (t >= k * DU_SEMANA - 1e-9) return new Date(d); }
  return new Date(c.fim);
}
const semanaDU = (d, c) => Math.max(1, Math.ceil(duEntre(c, d) / DU_SEMANA - 1e-9));
const cicloDaData = d => { const c = CALENDARIO.ciclos.find(x => d >= dataIso(x.ini) && d <= dataIso(x.fim)); return c ? c.n : (d < dataIso(CALENDARIO.ciclos[0].ini) ? 1 : CALENDARIO.ciclos[CALENDARIO.ciclos.length - 1].n); };
const fmtN = v => String(Math.round(v * 10) / 10).replace('.', ',');

/* Define ciclo, data de referência e dias úteis decorridos */
function aplicarTempo(){
  let ref = S.refManual && S.ref ? S.ref : S.seqInfo ? S.seqInfo.ref
          : S.dataEstat ? (d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - 1); return x; })(S.dataEstat)
          : (d => { d.setDate(d.getDate() - 1); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); })(new Date());
  const n = S.cicloN || (S.seqInfo ? parseInt(S.ciclo.replace(/\D/g, ''), 10) : cicloDaData(ref));
  const c = cicloCal(n) || cicloCal(cicloDaData(ref));
  if (ref > c.fim) ref = new Date(c.fim);
  S.ref = ref;
  const total = duEntre(c, c.fim), feitos = ref < c.ini ? 0 : duEntre(c, ref);
  S.T = {c, n: c.n, total, feitos, ref};
  CFG.semanasCiclo = Math.max(1, Math.ceil(total / DU_SEMANA - 1e-9));
  CFG.semanaAtual = Math.min(CFG.semanasCiclo, Math.max(1, Math.ceil(feitos / DU_SEMANA - 1e-9)));
  S.inicio = c.ini;
}
const fracCiclo = () => S.T && S.T.total ? Math.min(1, S.T.feitos / S.T.total) : 0;
function momentoTxt(){
  if (fracCiclo() >= 1) return 'no fim do ciclo';
  return `no ${S.T.n}º ciclo, com visitas até ${fmtD(S.T.ref)} (${fmtN(S.T.feitos)} de ${fmtN(S.T.total)} dias úteis)`;
}
function metaEm(r){
  r = Math.min(1, Math.max(0, r));
  const n = Math.max(1, CFG.semanasCiclo);
  let f;
  if (CFG.curva === 'fixa') f = 1;
  else if (CFG.curva === 'linear') f = r;
  else if (CFG.curva === 'prazo') return metaMarcos(r * (S.T ? S.T.total : n * DU_SEMANA) / DU_SEMANA);
  else f = 1 - Math.pow(1 - r, 2);
  return CFG.metaFinal * f;
}
/* Curva por marcos: sobe em linha reta (dia a dia) de um marco ao seguinte.
   Padrão: 0% no início, 90% no fim da 2ª semana, 100% no fim da 4ª, e 100% daí em diante. */
function metaMarcos(sem){
  const pts = [{sem:0, meta:0}, ...CFG.marcos.filter(m => m.sem > 0).sort((a, b) => a.sem - b.sem)];
  for (let i = 1; i < pts.length; i++){
    if (sem <= pts[i].sem){ const a = pts[i-1], b = pts[i]; return a.meta + (b.meta - a.meta) * (sem - a.sem) / (b.sem - a.sem); }
  }
  return pts[pts.length - 1].meta;
}
const marcosTxt = () => [...CFG.marcos].sort((a, b) => a.sem - b.sem).map(m => `${m.meta}% até o fim da ${m.sem}ª semana (${fmtN(m.sem * DU_SEMANA)} dias úteis)`).join(' e ');
function metaSemana(w){ return CFG.curva === 'prazo' ? metaMarcos(w) : metaEm(S.T ? Math.min(1, w * DU_SEMANA / S.T.total) : w / Math.max(1, CFG.semanasCiclo)); }
const curvaTxt = () => Array.from({length: Math.max(1, CFG.semanasCiclo)}, (_, i) => {
  const t = `S${i + 1} ${Math.round(metaSemana(i + 1))}%`; return i + 1 === +CFG.semanaAtual ? `<b>${t}</b>` : t; }).join(', ');
const naSemana = momentoTxt;

/* Sequência de visitação: escolhe o ciclo, infere início e data de referência,
   e transforma as datas em "visitado no ciclo" para o cruzamento por CRM */
function aplicarCiclo(){
  const seqs = S.stats.filter(x => x.seq);
  S.ciclos = [...new Set(seqs.flatMap(x => x.ciclos))];
  if (!seqs.length){ S.seqInfo = null; return; }
  const datasDo = c => seqs.flatMap(x => [...x.seq.values()].flatMap(r => r.ciclos[c] || []));
  const comDados = S.ciclos.filter(c => datasDo(c).length);
  if (S.cicloN){ const alvo = S.ciclos.find(c => parseInt(c.replace(/\D/g, ''), 10) === +S.cicloN); if (alvo) S.ciclo = alvo; }
  if (!S.ciclo || !comDados.includes(S.ciclo)) S.ciclo = comDados[comDados.length - 1];
  const ds = datasDo(S.ciclo), idx = S.ciclos.indexOf(S.ciclo);
  const min = new Date(Math.min(...ds)), ref = new Date(Math.max(...ds));
  S.seqInfo = {ciclo: S.ciclo, ref, min};
}
/* Visitas do ciclo até a data de referência (permite "voltar no tempo", ex.: ver como estava no fim da 2ª semana) */
function montarVisitas(){
  S.stats.filter(x => x.seq).forEach(x => {
    x.byCrm = new Map(); x.byNome = new Map();
    x.seq.forEach(r => { const n = (r.ciclos[S.ciclo] || []).filter(d => d <= S.T.ref).length; if (!n) return; if (r.crm) x.byCrm.set(r.crm, n); else x.byNome.set(r.nomeK, n); });
  });
}

/* Indicadores derivados */
function seqRec(med, d){
  for (const s of med){ if (!s.seq) continue; const r = (d.crm && s.seq.get(d.crm)) || s.seq.get('N:' + d.nomeK); if (r) return r; }
  return null;
}
function metricas(A){
  const W = CFG.pesos;
  const cov = {}, lo = {}, hi = {};
  let wc = 0, wv = 0, cc = 0, cv = 0;
  CATS.forEach(c => {
    const b = A.cats[c];
    cov[c] = pct(b.vis, b.cad); lo[c] = pct(b.min, b.cad); hi[c] = pct(b.max, b.cad);
    wc += W[c] * b.cad; wv += W[c] * b.vis; cc += b.cad; cv += b.vis;
  });
  const covW = pct(wv, wc), covC = pct(cv, cc);
  const prio = covW != null && covC ? covW / covC * 100 : null;   // 100 = neutro
  const cov1 = cov[1];
  const ritmo = fracCiclo();
  const exec = cov1 != null && ritmo > 0 ? cov1 / ritmo : null;
  // Limites do semáforo: com o ritmo ligado, a meta cresce com o ciclo (ex.: semana 2 de 5 = 40% dos limites)
  const limV = metaEm(ritmo), limA = Math.max(0, limV - CFG.tolerancia);
  let M_prova = false;
  let sem = cov1 == null ? 'cinza' : cov1*100 >= limV - 0.5 ? 'verde' : cov1*100 >= limA - 0.5 ? 'amarelo' : 'vermelho';
  /* Modo estimado: a estatística por especialidade não diz QUAIS médicos foram visitados.
     Em vez de julgar pela estimativa (que penaliza quem visitou todos os TOP 1), o sinal usa o que dá para provar:
     - verde: mesmo no pior caso, a meta foi cumprida (mínimo garantido >= meta)
     - vermelho / amarelo: mesmo no melhor caso (todos os visitados das especialidades sendo TOP 1), não daria
     - a confirmar: os números permitem ter cumprido; é preciso conferir na lista de visitados */
  if (cov1 != null && A.mode !== 'exato' && !A.confirmado){
    const lo1 = (lo[1] ?? 0) * 100, hi1 = (hi[1] ?? 0) * 100;
    // Cor pela estimativa, com a régua normal (vermelho provável quando a estimativa está abaixo da faixa amarela).
    // Só vira verde antes disso se o mínimo garantido já cumprir a meta. A conferência dos TOP 1 torna o sinal exato.
    if (lo1 >= limV - 0.5) sem = 'verde';
    M_prova = hi1 < limA - 0.5;   // vermelho comprovado: nem com todos os visitados sendo TOP 1 daria
  }
  // Semáforos do TOP 2 e TOP 3: mesma régua (meta e tolerância) do TOP 1
  const semCat = {};
  [2, 3].filter(c => A.cats[c]).forEach(c => {
    const v = cov[c];
    if (v == null){ semCat[c] = {sem:'cinza', prova:false}; return; }
    let sc = v*100 >= limV - 0.5 ? 'verde' : v*100 >= limA - 0.5 ? 'amarelo' : 'vermelho', pr = false;
    if (A.mode !== 'exato'){
      if ((lo[c] ?? 0) * 100 >= limV - 0.5) sc = 'verde';
      pr = (hi[c] ?? 0) * 100 < limA - 0.5;
    }
    semCat[c] = {sem:sc, prova:pr};
  });
  const est12 = pct(A.cats[1].vis + A.cats[2].vis, A.cats[1].cad + A.cats[2].cad);
  const desvios = CATS.slice(-2).filter(c => cov[c] != null && cov1 != null && cov[c] > cov1 + 0.005)
    .map(c => ({c, cov:cov[c], comprovado: A.mode === 'exato' || (lo[c] != null && hi[1] != null && lo[c] > hi[1])}));
  const dCad = cc - A.cats[1].cad, dVis = cv - A.cats[1].vis;
  return {cov, lo, hi, covW, covWlo:pct(A.wWorst, wc), covWhi:pct(A.wBest, wc), prio, cov1, ritmo, exec, sem, prova: M_prova, semCat, limV, limA, est12, desvios,
          covG:pct(A.total.vis, A.total.cad), covC, cc, cv, dCov:pct(dVis, dCad), share1Cad:pct(A.cats[1].cad, cc), share1Vis:pct(A.cats[1].vis, cv)};
}

/* =====================================================================
   6. INSIGHTS AUTOMÁTICOS
   ===================================================================== */
function gerarInsights(A, M){
  const L = [], est = A.mode !== 'exato' && !A.confirmado, ap = est ? 'Cerca de ' : '';
  if (M.cov1 != null){
    const t = {verde:'ok', amarelo:'warn', vermelho:'bad'}[M.sem] || 'info';
    { const g0 = gapMeta(A, M), b1 = A.cats[1], vis = est ? `cerca de ${Math.round(b1.vis)}` : fn(b1.vis), meta = Math.round(M.limV);
      const falta = g0 && g0.faltam ? ` ${g0.faltam === 1 ? 'Falta' : 'Faltam'} ${est ? 'cerca de ' : ''}${g0.faltam} para bater a meta de agora.` : '';
      const foram = !est && b1.vis === 1 ? 'médico TOP 1 foi visitado' : 'médicos TOP 1 foram visitados';
      const txt = M.sem === 'vermelho' ? `Apenas ${vis} de ${fn(b1.cad)} ${foram} (${fp(M.cov1)}), bem abaixo da meta de ${meta}% para este momento.${falta}`
        : M.sem === 'amarelo' ? `${vis} de ${fn(b1.cad)} médicos TOP 1 visitados (${fp(M.cov1)}), ainda abaixo da meta de ${meta}% para este momento.${falta}`
        : `${vis} de ${fn(b1.cad)} médicos TOP 1 visitados (${fp(M.cov1)}): meta de ${meta}% para este momento atingida.`;
      L.push({t, m: txt + (est ? ' Valor estimado pela estatística por especialidade.' : '')}); }
  } else L.push({t:'info', m:'Nenhum médico classificado como TOP 1 neste recorte.'});

  if (!est) CATS.slice(1).forEach(c => {
    if (M.cov[c] != null && M.cov1 != null && M.cov[c] > M.cov1 + 0.005)
      L.push({t: c >= ESC - 1 ? 'bad' : 'warn', m:`O TOP ${c} possui cobertura superior ao TOP 1 (${fp(M.cov[c])} contra ${fp(M.cov1)}).`});
  });
  if (M.est12 != null){
    if (M.est12 * 100 < M.limA) L.push({t:'bad', m:`Apenas ${fp(M.est12)} dos médicos estratégicos (TOP 1 e 2) receberam visita.`});
    else L.push({t: M.est12 * 100 > M.limV ? 'ok' : 'warn', m:`${fp(M.est12)} dos médicos estratégicos (TOP 1 e 2) receberam visita.`});
  }
  const g = gapMeta(A, M);
  if (g){
    const quando = fracCiclo() < 1 ? `meta de agora (${fmtN(S.T.feitos)} de ${fmtN(S.T.total)} dias úteis)` : 'meta de fim de ciclo';
    if (M.sem === 'vermelho' && est && M.prova) L.push({t:'bad', m:`Mesmo que todos os visitados das especialidades fossem TOP 1, a cobertura chegaria no máximo a ${fp(M.hi[1])}, abaixo da ${quando}, de ${Math.round(g.meta)}%. Há risco de baixa execução do plano de visitação.`});
    else if (M.sem === 'vermelho' && est) L.push({t:'bad', m:`A estimativa do TOP 1 está em ≈ ${fp(M.cov1)}, abaixo da faixa amarela da ${quando} (${Math.round(M.limA)}%). Provável baixa execução do plano de visitação: confirme com o botão Conferir TOP 1.`});
    // (modo exato: a frase principal acima já traz a meta e o que falta)
    else if (M.sem === 'amarelo' && est) L.push({t:'warn', m:`A estimativa do TOP 1 (≈ ${fp(M.cov1)}) está abaixo da ${quando}, de ${Math.round(g.meta)}%. Use o botão Conferir TOP 1 para confirmar com a lista de visitados do sistema.`});

    else if (M.sem === 'confirmar') L.push({t:'info', m:`A meta do TOP 1 (${Math.round(g.meta)}%, ${g.precisa} de ${g.cad} médicos) pode ter sido cumprida: o PV visitou médicos suficientes nas especialidades deles. Confira na lista de visitados do sistema.`});

  }
  const fo = focoPV(A, M, est);
  if (fo.c === 'g') L.push({t:'ok', m:`O PV está visitando mais os prioritários: ${fo.s}.`});
  else if (fo.c === 'r') L.push({t:'bad', m:`O PV está visitando mais os médicos de categoria baixa do que os prioritários: ${fo.s}.`});
  else if (fo.c === 'y') L.push({t:'warn', m:`O PV está visitando prioritários e demais na mesma proporção: ${fo.s.replace(' (parecidos)', '')}.`});
  if (A.missPrio1 > 0 && est)
    L.push({t:'bad', m:`Pelo menos ${A.missPrio1 === 1 ? '1 médico TOP 1 ficou' : fn(A.missPrio1) + ' médicos TOP 1 ficaram'} sem visita, com certeza: há menos visitados do que médicos TOP 1 em ${A.missEsps.slice(0,5).join(', ')}${A.missEsps.length > 5 ? ' e outras' : ''}.`});
  if (A.missPrio1 > 0 && !est)
    L.push({t:'warn', m:`${A.missPrio1 === 1 ? '1 médico TOP 1 ainda está' : fn(A.missPrio1) + ' médicos TOP 1 ainda estão'} sem nenhuma visita no ciclo. ${A.temSeq ? 'A lista está no quadro "TOP 1 sem visita".' : 'Filtre a tabela de médicos por "Não visitados" para ver a lista.'}`});
  if (M.cc > 0) CATS.forEach(c => {
    const p = A.cats[c].cad / M.cc;
    if (p > 0.6) L.push({t:'warn', m:`Classificação pouco seletiva: ${fp(p)} dos médicos classificados estão no TOP ${c}. Com a pirâmide achatada, o semáforo perde poder de diagnóstico.`});
  });
  if (M.share1Cad != null && M.share1Cad > 0.3)
    L.push({t:'warn', m:`O TOP 1 reúne ${fp(M.share1Cad)} dos médicos classificados. Com uma lista prioritária tão grande, a meta do TOP 1 perde foco.`});
  if (S.setor === 'ALL' && CFG.escala === 'auto'){
    const esc = [...new Set(S.panels.filter(p => p.docs.some(d => d.cat)).map(p => escalaUsada(p.docs)))].filter(Boolean).sort();
    if (esc.length > 1) L.push({t:'warn', m:`Os propagandistas usaram escalas diferentes (${esc.map(e => `1 a ${e}`).join(' e ')}). Para comparar setores, fixe a escala em Critérios e arquivos.`});
  }
  if (A.sem.cad > 0 && A.sem.cad / A.total.cad > 0.05)
    L.push({t:'info', m:`${fn(A.sem.cad)} médicos (${fp(A.sem.cad / A.total.cad)}) ainda estão sem categoria no painel.`});
  if (est)
    L.push({t:'info', m:'A estatística vem por especialidade, então a cobertura por categoria é estimada pelo mix de especialidades de cada categoria. Um relatório de visitas por médico (com CRM ou nome) torna o cálculo exato.'});
  return L;
}

    <ul class="ins">${ins.map(i => `<li class="${i.t}">${esc(i.m)}</li>`).join('')}</ul></section>
  ${!est && A.temSeq ? `<section class="tile"><h3>Em que semana cada categoria foi visitada?</h3>${htmlLeituraTempo(A)}<div class="chartbox" style="height:280px"><canvas id="ch6"></canvas></div>
    <p class="small muted" style="margin:8px 0 0">Percentual acumulado de médicos visitados em cada dia útil do ${S.T.n}º ciclo. Passe o mouse no gráfico para ver a data e o percentual de cada TOP. As marcas no eixo são o fim de cada semana de campo (4,5 dias úteis: seg a qui + sexta até 14h, sem reunião de ciclo e feriados). A linha tracejada é a meta do TOP 1. Linha do TOP 1 acima das outras e perto da meta = foco nos prioritários no começo do ciclo.</p></section>
  <section class="tile">${htmlPendentes(A)}</section>` : ''}
  <section class="grid2 g12">

            : `<div class="tile"><h3>Por especialidade</h3><p class="hint">${est ? 'Quantos TOP 1 e 2 existem em cada especialidade e quantos médicos da especialidade foram visitados.' : 'Cada célula mostra quantos foram visitados do total daquele grupo.'}</p>${htmlEsps(A, est)}</div>`}
  </section>

/* Eventos dos campos editáveis (setor, rótulo, ligação de especialidade, limpar) */
function ligarEdicao(root){
  root.querySelectorAll('[data-arq]').forEach(i => i.onchange = () => {
    const o = [...S.panels, ...S.stats].find(x => x.id === +i.dataset.arq);

/* Meta do TOP 1 na semana atual e quanto falta para chegar nela */
function gapMeta(A, M, c = 1){
  const cad = A.cats[c].cad, cv = M.cov[c];
  if (!cad || cv == null) return null;
  const meta = M.limV;
  // mínimo de médicos para atingir a meta; no consolidado, soma setor a setor (cada PV tem a sua meta)
  const partes = A.partes && A.partes.length ? A.partes.map(a => a.cats[c]) : [A.cats[c]];
  let precisa = 0, faltam = 0;
  partes.forEach(b => { if (!b.cad) return; const p = Math.min(b.cad, Math.ceil(meta / 100 * b.cad - 1e-9)); precisa += p; faltam += Math.max(0, p - Math.round(b.vis)); });
  return {meta, pp: cv * 100 - meta, faltam, precisa, cad};
}
function htmlSemaforo(M, est, A){
  const g = gapMeta(A, M);
  const on = x => M.sem === x ? ' on' : '';
  const b1 = A.cats[1], cad1 = b1.cad;
  const V = Math.round(M.limV), Am = Math.round(M.limA);
  const precisa = g ? g.precisa : 0;
  const momento = `${S.T.n}º ciclo · visitas até ${fmtD(S.T.ref)} · ${fmtN(S.T.feitos)} de ${fmtN(S.T.total)} dias úteis (semana ${CFG.semanaAtual} de campo)`;
  const regra = CFG.curva === 'prazo' ? `Regra: TOP 1 visitada ${marcosTxt()}.` : `Regra: a meta cresce ao longo do ciclo até ${CFG.metaFinal}%.`;
  if (M.sem === 'cinza') return `<div class="tile sema"><h3 style="margin:0">Semáforo do TOP 1</h3><div class="muted">Sem médicos TOP 1 neste recorte.</div></div>`;

  const vis = est ? Math.round(b1.vis) : b1.vis;
  const faltam = g ? g.faltam : 0;

/* Foco do PV: compara a cobertura dos prioritários com a dos demais.
   Exato: TOP 1 e 2 x TOP 3 em diante. Com TOP 1 conferida: TOP 1 x resto do painel.
   Estimado sem conferência: não há como saber (a estimativa dá a mesma taxa a todas as categorias). */
function focoPV(A, M, est){
  const cob = cs => { const c = cs.reduce((t, x) => t + A.cats[x].cad, 0), v = cs.reduce((t, x) => t + A.cats[x].vis, 0); return {c, v, p: pct(v, c)}; };
  let a, b, nA, nB;
  if (!est){ a = cob([1, 2]); b = cob(CATS.slice(2)); nA = 'TOP 1 e 2'; nB = ESC === 3 ? 'TOP 3' : ESC === 4 ? 'TOP 3 e 4' : `TOP 3 a ${ESC}`; }
  else if (A.confirmado){ a = cob([1]); const r = CATS.slice(1); b = {p: pct(A.total.vis - A.cats[1].vis, A.total.cad - A.cats[1].cad)}; nA = 'TOP 1'; nB = 'demais categorias'; }
  else return {v:'–', s:'aparece com dados por médico ou com a conferência dos TOP 1', c:''};
  if (a.p == null || b.p == null) return {v:'–', s:'sem médicos suficientes', c:''};
  const d = a.p - b.p;
  const s = `${nA}: ${fp(a.p)} visitados · ${nB}: ${fp(b.p)}`;
  if (d >= 0.10) return {v:nA, s, c:'g', nA, nB};
  if (d <= -0.10) return {v: nB.charAt(0).toUpperCase() + nB.slice(1), s, c:'r', nA, nB};
  return {v:'Sem foco', s: s + ' (parecidos)', c:'y', nA, nB};
}
/* Card da regra do 1º marco (padrão: 90% do TOP 1 até o fim da 2ª semana de campo).

function regraMarco(A){
  const m = [...CFG.marcos].sort((a, b) => a.sem - b.sem)[0];
  const titulo = `TOP 1 até a ${m.sem}ª semana`;
  if (!A.temSeq || !S.T) return {titulo, v:'–', s:'precisa da Sequência de Visitação (datas das visitas)', c:''};
  const c1 = A.docs.filter(d => d.cat === 1), n = c1.length;
  if (!n) return {titulo, v:'–', s:'sem médicos TOP 1', c:''};
  const limite = fimDaSemana(S.T.c, m.sem), concluida = S.T.feitos >= m.sem * DU_SEMANA - 1e-9;
  const v = c1.filter(d => d.primeira && d.primeira <= limite).length, p = v / n;
  const ok = p * 100 >= m.meta - 0.5;
  if (!concluida) return {titulo, v:`${v} de ${n}`, s:`em andamento: prazo até ${fmtD(limite)}, meta ${m.meta}%`, c:''};
  return {titulo, v:`${v} de ${n}`, s:`${fp(p)} até ${fmtD(limite)} · meta ${m.meta}% ${ok ? '✔ cumprida' : '✘ não cumprida'}`, c: ok ? 'g' : 'r'};
}

  const p1 = M.share1Cad, maior = CATS.reduce((m, c) => A.cats[c].cad > A.cats[m].cad ? c : m, 1), pm = A.cats[maior].cad / M.cc;
  let t = 'ok', msg = `TOP 1 com <b>${fn(A.cats[1].cad)}</b> médicos (<b>${fp(p1)}</b> do painel), dentro da referência de 10% a 15%.`;
  if (p1 > 0.2){ t = 'warn'; msg = `TOP 1 com <b>${fn(A.cats[1].cad)}</b> médicos (<b>${fp(p1)}</b> do painel), acima da referência de 10% a 15%: a lista prioritária está grande.`; }
  else if (p1 < 0.08){ t = 'warn'; msg = `TOP 1 com <b>${fn(A.cats[1].cad)}</b> médicos (<b>${fp(p1)}</b> do painel), abaixo da referência de 10% a 15%: vale ver se não faltou alguém importante.`; }
  if (pm > 0.6) msg += ` ${fp(pm)} dos médicos estão no TOP ${maior}: classificação pouco seletiva.`;
  if (A.sem.cad) msg += ` ${fn(A.sem.cad)} ainda sem categoria.`;
  return `<div class="leitura ${t}">${msg}</div>`;
}
/* Linha do tempo (sequência de visitação) */
const COR_LINHA = {1:'#D64545', 2:'#1F5FA8', 3:'#6FA8DC', 4:'#7A8B9C', 5:'#B8C4CF'};
function gruposTempo(){ return CATS.map(c => ({n:'TOP ' + c, cs:[c], cor: COR_LINHA[c] || '#9AA7B4'})); }
function curvaGrupo(A, cs){
  const ds = A.docs.filter(d => cs.includes(d.cat)), n = ds.length;
  const sem = Math.min(CFG.semanaAtual, CFG.semanasCiclo);
  return {n, pts: Array.from({length: CFG.semanasCiclo}, (_, i) => i + 1 > sem ? null : (n ? ds.filter(d => d.semana && d.semana <= i + 1).length / n : null)),
          ate: w => ds.filter(d => d.semana && d.semana <= w).length};
}
function htmlLeituraTempo(A){
  const c1 = curvaGrupo(A, [1]), n = c1.n;
  if (!n) return '';
  const marcos = CFG.curva === 'prazo' ? [...CFG.marcos].sort((a, b) => a.sem - b.sem).filter(m => m.sem * DU_SEMANA <= S.T.feitos + 1e-9) : [];
  const partes = marcos.map(m => { const v = c1.ate(Math.floor(m.sem)); const ok = v / n * 100 >= m.meta - 0.5;
    return `até o fim da ${Math.floor(m.sem)}ª semana (${fmtD(fimDaSemana(S.T.c, m.sem))}), <b>${v} de ${n}</b> (${fp(v / n)}) para meta de ${m.meta}% ${ok ? '✔' : '✘'}`; });
  const w1 = gruposTempo().map(g => ({g, p: curvaGrupo(A, g.cs).n ? curvaGrupo(A, g.cs).ate(1) / curvaGrupo(A, g.cs).n : null})).filter(x => x.p != null);
  const foco = w1.length > 1 ? ` Na 1ª semana: ${w1.map(x => `${x.g.n} ${fp(x.p)}`).join(', ')}.` : '';
  const ok = marcos.every(m => c1.ate(Math.floor(m.sem)) / n * 100 >= m.meta - 0.5);
  return `<div class="leitura ${marcos.length ? (ok ? 'ok' : 'bad') : ''}">TOP 1: ${partes.length ? partes.join('; ') + '.' : `${c1.ate(CFG.semanaAtual)} de ${n} visitados até agora.`}${foco}</div>`;
}

function htmlEsps(A, est){
  if (!A.docs.length) return '<p class="muted">Sem especialidades cruzadas.</p>';
  if (est){
    // estimado: não dá para saber quais TOP 1 foram visitados, só quantos existem e a cobertura da especialidade
    const rows = [...A.esps].sort((a,b) => b.n1 - a.n1 || b.N - a.N);
    return `<div class="scroll" style="max-height:360px;overflow-y:auto"><table class="compacta"><thead><tr><th>Especialidade</th><th class="n">Visitados (todos os TOPs)</th><th class="n">TOP 1 no painel</th><th class="n">TOP 2 no painel</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td>${esc(r.esp)}</td><td class="n">${fn(r.vis)} de ${fn(r.cad ?? r.N)} <span class="muted small">(${fp(r.cov)})</span></td><td class="n">${fn(r.n1)}</td><td class="n">${fn(r.n2)}</td></tr>`).join('')}
    </tbody></table></div>`;
  }
  // exato: cada célula = visitados de total
  const g = new Map();
  A.docs.forEach(d => { const k = d.espK; if (!g.has(k)) g.set(k, {esp: d.esp, n:0, v:0, n1:0, v1:0, n2:0, v2:0}); const x = g.get(k);
    x.n++; if (d.visitado) x.v++; if (d.cat === 1){ x.n1++; if (d.visitado) x.v1++; } if (d.cat === 2){ x.n2++; if (d.visitado) x.v2++; } });
  const rows = [...g.values()].sort((a, b) => (b.n1 - b.v1) - (a.n1 - a.v1) || b.n1 - a.n1 || b.n - a.n);
  const cel = (v, n) => !n ? '<span class="muted">–</span>' : `${v} de ${n}${n - v ? ` <span class="pill r">faltam ${n - v}</span>` : ' <span class="pill g">todos</span>'}`;
  return `<div class="scroll" style="max-height:360px;overflow-y:auto"><table class="compacta"><thead><tr><th>Especialidade</th><th class="n">TOP 1 visitados</th><th class="n">TOP 2 visitados</th><th class="n">Todos os médicos</th></tr></thead><tbody>
  ${rows.map(r => `<tr><td>${esc(r.esp)}</td><td class="n">${cel(r.v1, r.n1)}</td><td class="n">${cel(r.v2, r.n2)}</td><td class="n">${r.v} de ${r.n} <span class="muted small">(${fp(r.v / r.n)})</span></td></tr>`).join('')}
  </tbody></table></div>`;
}
/* Especialidades presentes no painel, para o filtro da tabela de médicos */
function espsDoPainel(A){
  const m = new Map();
  A.docs.forEach(d => { if (!m.has(d.espK)) m.set(d.espK, {k: d.espK, esp: d.esp || '(sem especialidade)', n: 0}); m.get(d.espK).n++; });
  return [...m.values()].sort((a, b) => a.esp.localeCompare(b.esp));
}
/* Resumo unificado da seleção: quantos médicos, quantos visitados e em que semana */
function htmlResumoSelecao(sel, est, temSem, topsOn){
  const nomeTop = topsOn.length ? topsOn.map(c => c === '0' ? 'Sem categoria' : 'TOP ' + c).join(' + ') : 'Todos os TOPs';
  const partes = [nomeTop];
  if (S.fEsp !== 'all' && sel[0]) partes.push(sel[0].esp);
  if (S.fCid !== 'all' && sel[0]) partes.push(sel[0].cidade || 'Sem cidade');
  if (S.q) partes.push(`busca "${esc(S.q)}"`);
  const tit = `Seleção: ${partes.map(esc).join(' · ')}`;
  if (!sel.length) return `<div class="selres"><div class="tit">${tit}</div><span class="muted">Nenhum médico nessa combinação.</span></div>`;
  if (est) return `<div class="selres"><div class="tit">${tit}</div>${fn(sel.length)} médicos. Com a estatística por especialidade não dá para saber quais foram visitados.</div>`;
  const vis = sel.filter(d => d.visitado).length, falta = sel.length - vis;
  let semHtml = '';
  if (temSem){
    const n = Math.max(1, CFG.semanasCiclo); let acum = 0;
    semHtml = `<div class="semrow">${Array.from({length: n}, (_, i) => {
      const w = i + 1, q = sel.filter(d => d.visitado && d.semana === w).length; acum += q;
      const futura = w > +CFG.semanaAtual;
      return `<button type="button" class="semc${S.fSem === String(w) ? ' on' : ''}" data-sem="${w}" title="Listar os médicos visitados pela 1ª vez na semana ${w}">S${w}${w === +CFG.semanaAtual ? ' (atual)' : ''}: <b>${fn(q)}</b> <small>· acum. ${futura && !q ? '–' : fp(acum / sel.length)}</small></button>`;
    }).join('')}${falta ? `<button type="button" class="semc${S.fVis === 'nao' && S.fSem === 'all' ? ' on' : ''}" data-sem="nao">Sem visita: <b>${fn(falta)}</b></button>` : ''}</div>`;
  }
  return `<div class="selres"><div class="tit">${tit}</div>${fn(sel.length)} médicos · <b>${fn(vis)}</b> visitados (<b>${fp(vis / sel.length)}</b>) · ${fn(falta)} sem visita no ciclo${temSem ? '. Por semana da 1ª visita (clique para listar):' : ''}${semHtml}</div>`;
}

    ${est ? '' : `<label class="field">Visitado<select id="fVis">${[['all','Todos'],['nao','Não visitados'],['sim','Visitados']].map(o => `<option value="${o[0]}"${S.fVis === o[0] ? ' selected' : ''}>${o[1]}</option>`).join('')}</select></label>`}
    ${temSem ? `<label class="field">Semana da visita<select id="fSem"><option value="all">Todas</option>${Array.from({length: Math.max(1, CFG.semanasCiclo)}, (_, i) => `<option value="${i + 1}"${S.fSem === String(i + 1) ? ' selected' : ''}>Semana ${i + 1}${i + 1 === +CFG.semanaAtual ? ' (atual)' : ''}</option>`).join('')}</select></label>` : ''}
    <label class="field">Cidade<select id="fCid"><option value="all">Todas</option>${porCidade(A).sort((a, b) => a.nome.localeCompare(b.nome)).map(c => `<option value="${esc(c.k)}"${S.fCid === c.k ? ' selected' : ''}>${esc(c.nome)}</option>`).join('')}</select></label>
    <label class="field">Busca<input type="search" id="fQ" value="${esc(S.q)}" placeholder="Nome, CRM, especialidade, cidade"></label>
    <span class="small muted" style="padding-bottom:7px">${fn(docs.length)} médicos${docs.length > lim ? `, mostrando os primeiros ${lim}` : ''}</span>
  </div>

  ${est ? '<p class="hint" style="margin-top:0">Com a estatística por especialidade não dá para saber quem foi visitado. A coluna mostra a cobertura da especialidade do médico.</p>' : ''}
  <div class="scroll" style="max-height:440px;overflow-y:auto"><table><thead><tr>${multi ? '<th>Setor</th>' : ''}<th>TOP</th><th>Médico</th><th>CRM</th><th>Especialidade</th><th>Cidade</th><th>${est ? 'Cob. da especialidade' : A.temSeq ? `Visita no ${esc(S.ciclo)}` : 'Visitas'}</th></tr></thead><tbody>
  ${docs.slice(0, lim).map(d => `<tr>${multi ? `<td class="small">${esc(d.setor)}</td>` : ''}<td>${d.cat ? `<span class="cat" style="background:${CAT_COR[d.cat]};${d.cat >= 4 ? 'color:#0E2A47' : ''}">${d.cat}</span>` : '<span class="muted small">–</span>'}</td>

  </tbody></table></div>`;
